<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <meta name="description" content="Long-form reading, organized into a calm daily Kindle publication that keeps you in charge of your attention.">
  <title>Long Form</title>
  <style>
    :root{
      --bg:#f4efe5;
      --paper:#fffdf8;
      --ink:#1e1b17;
      --muted:#71695e;
      --line:#d8cfbf;
      --line-soft:#ebe4d8;
      --green:#174f3c;
      --green-2:#0e3b2c;
      --green-soft:#e6efe9;
      --amber:#8a5b12;
      --amber-soft:#f8edd7;
      --red:#9b2f2f;
      --red-soft:#f7e6e4;
      --shadow:0 18px 50px rgba(62,47,27,.08);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
      radial-gradient(circle at 15% 0%,rgba(255,255,255,.8),transparent 30rem),var(--bg)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .shell{max-width:1080px;margin:0 auto;padding:24px 18px 70px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:-.02em}
    .sun{width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;font-family:system-ui;font-size:14px}
    .top-actions{display:flex;gap:8px;align-items:center}
    .hero{padding:74px 0 36px;max-width:760px}
    .eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--green)}
    h1,h2,h3{font-family:Georgia,serif;letter-spacing:-.025em}
    h1{font-size:clamp(48px,8vw,82px);line-height:.95;margin:13px 0 20px;font-weight:600}
    h2{font-size:30px;line-height:1.05;margin:0 0 12px}
    h3{font-size:20px;margin:0}
    p{line-height:1.55}
    .lede{font-size:19px;max-width:650px;color:var(--muted);margin:0}
    .muted{color:var(--muted)}
    .tiny{font-size:12px}
    .small{font-size:14px}
    .card{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
    .auth-card{max-width:480px;margin-top:26px}
    .field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
    .field label{font-size:13px;font-weight:750}
    .input,.select{width:100%;background:white;border:1px solid #cfc4b2;border-radius:12px;padding:12px 13px;color:var(--ink);outline:none;transition:.15s border-color,.15s box-shadow}
    .input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,79,60,.1)}
    .btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:10px 15px;font-weight:760;transition:.15s transform,.15s background,.15s border-color}
    .btn:hover{transform:translateY(-1px);border-color:#bdb09c}
    .btn:active{transform:translateY(0)}
    .btn.primary{background:var(--green);border-color:var(--green);color:white}
    .btn.primary:hover{background:var(--green-2)}
    .btn.danger{color:var(--red)}
    .btn.ghost{background:transparent}
    .btn.small-btn{padding:7px 11px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:default;transform:none}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .wrap{flex-wrap:wrap}
    .stack{display:flex;flex-direction:column;gap:12px}
    .grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:20px;margin-top:24px}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
    .stat{background:rgba(255,253,248,.7);border:1px solid var(--line);border-radius:16px;padding:16px}
    .stat .value{font-family:Georgia,serif;font-size:26px}
    .section-card{padding:0;overflow:hidden}
    .section-head{padding:20px 20px 16px}
    .section-name{display:flex;align-items:center;gap:10px}
    .feed-list{border-top:1px solid var(--line-soft)}
    .feed{padding:15px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line-soft)}
    .feed:first-child{border-top:none}
    .feed-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .feed-url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px;margin-top:4px}
    .feed-actions{display:flex;align-items:center;gap:7px}
    .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;background:var(--green-soft);color:var(--green)}
    .status.off{background:#eeeae2;color:#6f685d}
    .status.warn{background:var(--amber-soft);color:var(--amber)}
    .status.fail{background:var(--red-soft);color:var(--red)}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .empty{padding:24px 20px;color:var(--muted)}
    .side-card{margin-bottom:14px}
    .side-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted);margin-bottom:10px}
    .delivery-time{font-family:Georgia,serif;font-size:38px;margin:0}
    .timeline{display:flex;flex-direction:column}
    .run{padding:12px 0;border-top:1px solid var(--line-soft)}
    .run:first-child{border-top:none;padding-top:0}
    .run-title{font-weight:750}
    .run-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .onboarding{max-width:760px;margin:52px auto 0}
    .step{display:grid;grid-template-columns:36px 1fr;gap:15px;padding:18px 0;border-top:1px solid var(--line-soft)}
    .step:first-of-type{border-top:none}
    .step-num{width:32px;height:32px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-weight:850}
    .step h3{margin:1px 0 6px}
    .codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3eee4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .codebox code{overflow:hidden;text-overflow:ellipsis}
    .inline-form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 20px;background:#fbf7ef;border-top:1px solid var(--line-soft)}
    .notice{border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.45}
    .notice.info{background:var(--green-soft);color:#153e30}
    .notice.error{background:var(--red-soft);color:var(--red)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:44px}
    .toolbar h2{margin:0}
    .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:rgba(35,28,20,.38);backdrop-filter:blur(4px);z-index:30}
    .modal.open{display:grid}
    .modal-card{width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 100px rgba(36,27,15,.24);padding:22px}
    .modal.flow .modal-card{width:min(960px,100%);max-height:94vh;border-radius:8px}
    .preview-list{display:flex;flex-direction:column;gap:0}
    .preview-item{padding:14px 0;border-top:1px solid var(--line-soft)}
    .preview-item:first-child{border-top:none}
    .preview-item a{text-decoration:none;font-weight:760}
    .preview-source{font-size:12px;color:var(--muted);margin-top:4px}
    .one-time-action{width:100%;margin-top:12px;padding:10px 0 2px;border:0;border-top:1px solid var(--line-soft);background:transparent;text-align:left;font:700 13px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);cursor:pointer}
    .one-time-action:hover{color:var(--red)}
    .one-time-list{margin-top:14px;border-top:1px solid var(--line)}
    .one-time-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
    .one-time-item-title{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.25;font-weight:600}
    .one-time-item-url{margin-top:5px;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
    .one-time-item-error{margin-top:6px;font-size:12px;line-height:1.4;color:var(--red)}
    .one-time-item-actions{display:flex;gap:5px;align-items:flex-start}
    .one-time-item-actions .btn{min-width:44px;min-height:44px;padding:8px 10px}
    .one-time-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
    .one-time-summary .muted{margin:0}
    textarea.article-urls{min-height:154px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}
    .toast{position:fixed;right:18px;bottom:18px;max-width:360px;background:#1f1b17;color:white;border-radius:14px;padding:13px 15px;box-shadow:0 15px 60px rgba(0,0,0,.25);z-index:50;display:none}
    .toast.show{display:block}
    footer{margin-top:38px;padding-top:18px;border-top:1px solid rgba(126,111,92,.25);color:var(--muted);font-size:12px}
    footer a{margin-right:15px}
    [hidden]{display:none!important}
    .content-section{display:flex;flex-direction:column;gap:12px}
    .content-section + .content-section{margin-top:30px}
    .section-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .section-intro h2{margin:0}
    .section-copy{font-size:14px;color:var(--muted);line-height:1.5;margin-top:5px;max-width:620px}
    .feed-intake{padding:20px}
    .feed-intake-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
    .feed-intake-head h2{margin:0}
    .feed-intake-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px) auto;gap:10px;align-items:end}
    .feed-intake-form .field{margin:0;min-width:0}
    .feed-intake-form .btn{min-height:43px}
    .section-card{padding:0;overflow:hidden}
    .section-head{padding:17px 18px}
    .section-name{display:flex;align-items:baseline;gap:8px;min-width:0}
    .section-name h3{font-size:22px}
    .section-meta{font-size:13px;color:var(--muted);white-space:nowrap}
    .disclosure-btn{width:36px;height:36px;padding:0!important;display:grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto}
    .edition-manage{display:flex;align-items:center;justify-content:flex-end;padding:10px 18px;background:#fbf7ef;border-top:1px solid var(--line-soft)}
    @media(max-width:760px){
      .shell{padding:18px 14px 58px}
      .hero{padding-top:50px}
      .grid{grid-template-columns:1fr}
      .stat-grid{grid-template-columns:1fr 1fr}
      .stat-grid .stat:last-child{grid-column:1/-1}
      .feed{grid-template-columns:1fr}
      .feed-actions{justify-content:flex-start;flex-wrap:wrap}
      .toolbar{align-items:flex-start;flex-direction:column}
      .feed-intake{padding:18px}
      .feed-intake-head{flex-direction:column;margin-bottom:14px}
      .feed-intake-form{grid-template-columns:1fr}
      .source-actions{grid-template-columns:1fr;max-width:none}
      .source-action{width:100%}

      .feed-intake-form .btn{width:100%}
      .section-intro{align-items:flex-start}
      .section-head{padding:16px}
      .section-name{gap:7px}
      .section-name h3{font-size:21px}
      .inline-form{grid-template-columns:1fr}
      .topbar{align-items:flex-start}
      .one-time-item{grid-template-columns:1fr}
      .one-time-item-actions{justify-content:flex-start}
      .one-time-summary{align-items:stretch;flex-direction:column}
      .one-time-summary .btn{width:100%}
    }

    /* Editorial UI: Economist-inspired, technical, mobile-first */
    :root{
      --bg:#f7f5ef;
      --paper:#fff;
      --ink:#11110f;
      --muted:#67645e;
      --line:#bdb9b0;
      --line-soft:#dfdcd5;
      --green:#0d5f4c;
      --green-2:#09483a;
      --green-soft:#eaf2ef;
      --red:#b3131b;
      --red-soft:#f8eaea;
      --shadow:none;
      --radius:2px;
    }
    html,body{background:var(--bg)}
    body{background:var(--bg)}
    .shell{max-width:1040px;padding:22px 20px 64px}
    .topbar{padding-bottom:18px;border-bottom:1px solid var(--ink)}
    .brand-wrap{min-width:0}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1}
    .brand-kicker{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .sun{display:none}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none}
    .btn{border-radius:2px;padding:9px 13px;background:transparent;border:1px solid var(--line);font-weight:700}
    .btn:hover{transform:none;border-color:var(--ink);background:#fff}
    .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
    .btn.primary:hover{background:var(--green-2);border-color:var(--green-2)}
    .btn.small-btn{padding:7px 10px;font-size:12px}
    .input,.select{border-radius:2px;border-color:var(--line);padding:11px 12px;background:#fff}
    .input:focus,.select:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
    .eyebrow,.side-title,.editorial-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink)}
    .editorial-section{padding:26px 0;border-bottom:1px solid var(--ink)}
    .editorial-section:first-child{padding-top:6px}
    .editorial-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
    .editorial-head h1,.editorial-head h2{margin:4px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.035em}
    .editorial-head h1{font-size:46px;line-height:1}
    .editorial-head h2{font-size:36px;line-height:1}
    .editorial-copy{max-width:630px;color:#494741;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.45;margin-top:10px}
    .intake-actions{display:flex;gap:8px;align-items:center}
    .source-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;max-width:560px}
    .source-action{min-height:54px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px}
    .source-action strong{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:600}
    .source-action span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

    .feed-intake{padding:0;border:0;background:transparent}
    .feed-intake-head{display:none}
    .feed-intake-form{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:8px;align-items:end}
    .feed-intake-form .field{margin:0}
    .field label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .technical-note{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);margin-top:9px}
    .editions-list{border-top:1px solid var(--line)}
    .section-card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
    .section-head{padding:15px 0}
    .edition-index{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);font-size:13px;font-weight:800;width:34px;flex:0 0 34px}
    .section-name{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
    .section-name h3{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:600;letter-spacing:-.025em}
    .section-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
    .disclosure-btn{border:0;background:transparent;width:34px;height:34px;padding:0!important;font-size:18px}
    .disclosure-btn:hover{background:transparent}
    .edition-details{border-top:1px solid var(--line-soft);padding:0 0 10px 34px}
    .edition-manage{display:flex;justify-content:flex-end;padding:9px 0;background:transparent;border:0}
    .feed-list{border-top:0}
    .feed{padding:12px 0;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    .feed:first-child{border-top:1px solid var(--line-soft)}
    .feed-title{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:600}
    .feed-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;margin-top:3px}
    .feed-actions{display:flex;align-items:center}
    .feed-manage{border:0;padding:5px 7px;font-size:18px;letter-spacing:.08em;background:transparent}
    .status{border-radius:2px;padding:4px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
    .empty{padding:16px 0}
    .new-edition-row{display:flex;justify-content:flex-start;padding-top:14px}
    .delivery-block{padding:0}
    .delivery-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
    .delivery-time{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1}
    .delivery-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);margin-top:6px}
    .delivery-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .latest-run{margin-top:15px;padding-top:12px;border-top:1px solid var(--line-soft);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted)}
    .problem-banner{border-left:3px solid var(--red);padding:10px 12px;margin:0 0 18px;background:#fff;font-size:12px}
    .grid.editorial-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.75fr);gap:28px;margin-top:28px}
    .side-card{border:0;border-top:1px solid var(--ink);padding:18px 0;margin:0;background:transparent}
    .side-card + .side-card{margin-top:18px}
    footer{border-top:1px solid var(--ink);padding-top:15px}
    @media(max-width:760px){
      .shell{padding:16px 16px 48px}
      .topbar{padding-bottom:14px}
      .brand{font-size:27px}
      .brand-kicker{font-size:9px}
      .grid.editorial-grid{grid-template-columns:1fr;gap:0;margin-top:18px}
      .editorial-section{padding:22px 0}
      .editorial-head{display:block;margin-bottom:14px}
      .editorial-head h1{font-size:39px}
      .editorial-head h2{font-size:32px}
      .editorial-copy{font-size:16px;margin-top:8px}
      .intake-actions{margin-top:14px}
      .feed-intake-form{grid-template-columns:1fr}
      .feed-intake-form .btn{width:100%}
      .section-head{padding:14px 0}
      .section-name{display:block}
      .section-name h3{font-size:24px}
      .section-meta{display:block;margin-top:3px}
      .edition-details{padding-left:0}
      .feed{padding:12px 0}
      .feed-title{font-size:17px}
      .feed-url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72vw}
      .delivery-main{grid-template-columns:1fr}
      .delivery-actions{justify-content:flex-start}
      .side-card{padding:20px 0}
      .top-actions .btn{padding:7px 9px;font-size:11px}
    }

    .starter-page{max-width:780px;margin:0 auto;padding:42px 0 20px}
    .starter-page h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,64px);line-height:.98;font-weight:600;letter-spacing:-.04em;margin:10px 0 14px}
    .starter-deck{border-top:1px solid var(--ink);margin-top:28px}
    .starter-option{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
    .starter-option h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:600;margin:0}
    .starter-option p{margin:5px 0 8px;color:#4f4c46;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.4}
    .starter-sources{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .starter-add{width:42px;height:42px;padding:0!important;font-size:24px;display:grid;place-items:center;border-color:var(--ink)}
    .starter-add:hover{background:var(--red);border-color:var(--red);color:white}
    .starter-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:18px;flex-wrap:wrap}
    .starter-ready{max-width:720px;margin:0 auto;padding:54px 0 20px}

    .ready-edition{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0;margin:26px 0}
    .ready-edition-name{font-family:Georgia,"Times New Roman",serif;font-size:28px}

    .setup-page{max-width:760px;margin:0 auto;padding:44px 0 20px}
    .setup-page h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,62px);font-weight:600;letter-spacing:-.04em;line-height:1;margin:10px 0 14px}
    .setup-list{border-top:1px solid var(--ink);margin-top:28px}
    .setup-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}
    .setup-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);font-weight:800;font-size:13px;padding-top:4px}
    .setup-row h3{font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;margin:0 0 6px}

    .setup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
    @media(max-width:760px){

      .setup-row{grid-template-columns:34px minmax(0,1fr);gap:10px}
      .ready-actions .btn,.setup-actions .btn{width:100%}

    /* Editorial auth + source-action refinement */

    .auth-page .auth-hero{padding:0 0 34px;border-bottom:1px solid var(--ink)}
    .auth-page .auth-kicker{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
      letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--red)
    }
    .auth-page h1{
      font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,8vw,78px);
      line-height:.94;font-weight:600;letter-spacing:-.045em;margin:12px 0 16px
    }
    .auth-page .auth-lede{
      max-width:610px;font-family:Georgia,"Times New Roman",serif;font-size:18px;
      line-height:1.45;color:#4f4c46

    .auth-form-section{padding:26px 0 12px}
    .auth-form-section h2{
      font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1;
      margin:5px 0 8px;font-weight:600;letter-spacing:-.03em
    }
    .auth-form-copy{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:18px}
    .auth-form{max-width:540px}
    .auth-form .field{margin:0 0 12px}
    .auth-form .input{
      border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;
      padding:13px 0;font-family:Georgia,"Times New Roman",serif;font-size:21px
    }
    .auth-form .input:focus{border-color:var(--red);box-shadow:none}
    .auth-form .field label{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
      text-transform:uppercase;letter-spacing:.1em;color:var(--muted)
    }
    .auth-form-actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
    .auth-form-actions .btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;line-height:1.1}
    .auth-note{
      margin-top:18px;padding-top:13px;border-top:1px solid var(--line-soft);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
      line-height:1.5;color:var(--muted)
    }
    .source-index-list{border-top:1px solid var(--line);margin-top:12px}
    .source-index-action{
      color:var(--ink);text-decoration:none;cursor:pointer;width:100%;
      display:flex;align-items:center;gap:12px;min-height:64px;padding:13px 0;
      border-bottom:1px solid var(--line);background:transparent;text-align:left
    }
    .source-index-number{
      width:34px;flex:0 0 34px;font-family:Georgia,"Times New Roman",serif;color:var(--red);
      font-weight:700;font-size:21px;line-height:1;text-align:left
    }
    .source-index-copy{display:block;min-width:0;flex:1}
    .source-index-title{
      display:block;font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:600;
      line-height:1.08;letter-spacing:-.015em
    }
    .source-index-meta{
      display:block;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)
    }
    .source-index-arrow{
      flex:0 0 auto;font-family:Georgia,"Times New Roman",serif;font-size:22px;color:var(--ink)
    }
    .source-index-action:hover .source-index-title,.source-index-action:hover .source-index-arrow{color:var(--red)}
    @media(max-width:760px){
      .auth-page{padding-top:30px}
      .auth-page .auth-hero{padding-bottom:26px}
      .auth-page h1{font-size:51px}
      .auth-page .auth-lede{font-size:16px}
      .auth-form-section{padding-top:22px}
      .auth-form-section h2{font-size:27px}
      .auth-form-actions .btn{width:auto}
      .dashboard-main .add-sources-head{margin-bottom:0}
      .dashboard-main .add-sources-head .editorial-copy{display:none}
      .source-index-action{min-height:66px;padding:14px 0}
      .source-index-title{font-size:18px}
      .source-index-meta{margin-top:5px}
    }

    /* System health */
    .system-page{max-width:920px;margin:0 auto;padding:34px 0 12px}
    .system-page h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,64px);line-height:.96;font-weight:600;letter-spacing:-.045em;margin:9px 0 12px}
    .system-page .system-copy{max-width:620px;color:var(--muted);font-size:14px;line-height:1.5}
    .system-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:28px 0 0}
    .system-metric{padding:18px 16px 17px 0;min-width:0}
    .system-metric + .system-metric{padding-left:16px;border-left:1px solid var(--line)}
    .system-metric-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .system-metric-value{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1;margin-top:8px;letter-spacing:-.03em}
    .system-section{padding:24px 0;border-bottom:1px solid var(--ink)}
    .system-section h2{margin:5px 0 13px}
    .health-alert{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
    .health-alert:first-of-type{border-top:1px solid var(--line)}
    .health-alert-severity{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
    .health-alert.error .health-alert-severity{color:var(--red)}
    .health-alert.warning .health-alert-severity{color:#8a5b12}
    .health-clear{font-family:Georgia,"Times New Roman",serif;font-size:19px;padding:10px 0 2px}
    .system-list{border-top:1px solid var(--line)}
    .system-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
    .system-row-title{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:600}
    .system-row-meta{margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;line-height:1.45;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .system-row-error{margin-top:5px;font-size:12px;line-height:1.45;color:var(--red)}
    .system-job-status{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px;white-space:nowrap}
    .system-job-status.failed{color:var(--red)}
    .system-job-status.queued,.system-job-status.running{color:#8a5b12}
    .system-note{margin-top:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;line-height:1.55;color:var(--muted)}
    @media(max-width:760px){
      .system-page{padding-top:26px}
      .system-page h1{font-size:46px}
      .system-metrics{grid-template-columns:1fr 1fr}
      .system-metric:nth-child(3){border-left:0;border-top:1px solid var(--line);padding-left:0}
      .system-metric:nth-child(4){border-top:1px solid var(--line)}
      .system-row{grid-template-columns:1fr}
    }

    /* Social sign-in */
    .auth-provider-list{max-width:540px;display:flex;flex-direction:column;gap:8px;margin-top:18px}
    .auth-provider-button{
      width:100%;min-height:46px;border:1px solid var(--ink);border-radius:2px;background:transparent;
      color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
      font-weight:750;text-align:left
    }
    .auth-provider-button:hover{background:#fff}
    .auth-provider-button:disabled{opacity:.5;cursor:default}
    .auth-provider-name{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:600}
    .auth-provider-arrow{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1}
    .auth-divider{
      max-width:540px;display:flex;align-items:center;gap:10px;margin:20px 0 18px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;
      letter-spacing:.12em;text-transform:uppercase;color:var(--muted)
    }
    .auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}
    .auth-provider-note{
      max-width:540px;margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:9px;line-height:1.5;color:var(--muted)
    }
.section-days-link{display:block;margin-top:7px;padding:4px 0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.section-days-link:hover{opacity:.7}.edition-next-label{font-size:12px;margin-bottom:8px;color:var(--muted)}.edition-next{font-size:21px;line-height:1.3;margin-bottom:9px;font-weight:600}
.schedule-days{border:0;padding:0;margin:20px 0}.schedule-days legend{font-size:13px;font-weight:600;margin-bottom:10px}.day-options{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day-option{position:relative;cursor:pointer;text-align:center}.day-option input{position:absolute;opacity:0;width:100%;height:100%;inset:0;cursor:pointer;margin:0}.day-option span{display:block;border:1px solid var(--line,#ccc);border-radius:6px;padding:13px 0;font-size:13px}.day-option input:checked+span{background:#20201d;color:#fff;border-color:#20201d}.day-option input:focus-visible+span{outline:2px solid #327562;outline-offset:3px}.schedule-toggle{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:14px}.schedule-toggle input{width:19px;height:19px;accent-color:#20201d}
@media(max-width:420px){.day-options{gap:4px}.day-option span{font-size:12px}.edition-next{font-size:18px}}
    .problem-banner{font-size:14px;line-height:1.5}
    .source-problems{list-style:none;margin:8px 0 0;padding:0}
    .source-problems li+li{border-top:1px solid var(--line-soft)}
    .source-problem-link{display:block;width:100%;padding:10px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
    .source-problem-context{display:block;color:var(--muted);font-size:14px}
    .source-problem-action{display:block;color:var(--red);text-decoration:underline;text-underline-offset:3px;font-size:14px}
    .section-name{flex-wrap:wrap}
    .section-attention{display:block;border:0;background:none;color:var(--red);font:inherit;font-size:14px;padding:5px 0;text-align:left;text-decoration:underline;cursor:pointer}
    .feed-error{color:var(--red);font-size:14px;line-height:1.5;margin-top:7px;overflow-wrap:anywhere}
    .feed:focus{outline:2px solid var(--red);outline-offset:-2px}
    .feed-title{white-space:normal;overflow-wrap:anywhere}
    .source-context{font-size:14px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}

    :root{
      --bg:#f4f1e9;
      --surface:#fbfaf6;
      --surface-strong:#fff;
      --ink:#171614;
      --muted:#747169;
      --muted-2:#98938a;
      --line:#dfdbd1;
      --line-strong:#c5c0b6;
      --accent:#cf1f2c;
      --accent-soft:#fff0f1;
      --red:#a51d25;
      --red-soft:#f8e9e9;
      --shadow-soft:0 1px 1px rgba(23,22,20,.035),0 12px 34px rgba(23,22,20,.055);
      --radius:18px;
    }
    html,body{background:var(--bg)}
    body{
      color:var(--ink);
      background:radial-gradient(circle at 50% -20%,rgba(255,255,255,.9),transparent 36rem),var(--bg);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    .shell{max-width:860px;margin:0 auto;padding:22px 20px 72px}
    .topbar{border:0;padding:0 0 28px;align-items:center}
    .brand-wrap{position:relative;padding-left:13px}
    .brand-wrap:before{content:"";position:absolute;left:0;top:1px;width:3px;height:40px;border-radius:2px;background:var(--accent)}
    .brand{
      font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
      font-size:34px;
      line-height:.96;
      letter-spacing:-.045em;
      font-weight:700;
    }
    .brand-kicker{
      margin-top:6px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:9px;
      line-height:1.2;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .account-menu-btn{
      min-width:auto!important;height:auto!important;padding:10px 0 10px 18px!important;
      border:0!important;background:transparent!important;color:var(--muted)!important;
      font-size:13px!important;font-weight:650!important
    }
    .account-menu-btn:hover{color:var(--ink)!important}
    .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
    .home-dashboard{display:flex;flex-direction:column;gap:14px}
    .issue-card,.library-card{
      background:rgba(255,255,255,.7);
      border:1px solid rgba(151,145,132,.28);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }
    .editor-card{
      background:rgba(255,255,255,.42);
      border:1px solid rgba(151,145,132,.22);
      border-radius:var(--radius);
      overflow:hidden;
    }
    .editor-open{
      appearance:none;width:100%;border:0;background:transparent;padding:19px 20px;
      color:var(--ink);display:flex;align-items:center;justify-content:space-between;
      gap:18px;text-align:left;cursor:pointer
    }
    .editor-open:hover{background:rgba(255,255,255,.42)}
    .editor-copy{display:block;min-width:0}
    .editor-title{display:block;margin-top:4px;font-size:18px;line-height:1.2;letter-spacing:-.018em;font-weight:750}
    .editor-summary{
      display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45;
      max-width:620px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical
    }
    .editor-state{
      flex:0 0 auto;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap
    }
    .editor-state strong{color:var(--ink);font-weight:750}
    .editor-rule-list{margin:18px 0 0;border-top:1px solid var(--line)}
    .editor-rule{
      display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;
      padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45
    }
    .editor-rule-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-size:9px;padding-top:2px}
    .editor-lock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
    textarea.editor-textarea{min-height:116px;resize:vertical;line-height:1.5}
    .editor-effective{margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .editor-effective summary{padding:12px 0;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
    .editor-effective summary:hover{color:var(--ink)}
    .editor-effective-body{padding:0 0 14px;font-size:11px;line-height:1.5}
    .effective-block{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(23,22,20,.045);white-space:pre-wrap;overflow-wrap:anywhere}
    .effective-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .editor-form-actions{display:flex;justify-content:flex-end;margin-top:16px}
    .issue-card{padding:24px}
    .issue-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .micro-label{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:10px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent);font-weight:800
    }
    .issue-state{
      display:inline-flex;align-items:center;gap:6px;color:#2f6d57;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.04em
    }
    .issue-state:before{
      content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
      box-shadow:0 0 0 4px rgba(47,109,87,.1)
    }
    .issue-state.paused{color:var(--muted)}
    .issue-time{
      margin:14px 0 9px;
      font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
      font-size:clamp(43px,8vw,60px);line-height:.96;letter-spacing:-.05em;font-weight:650
    }
    .issue-schedule{
      color:var(--muted);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:11px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-wrap:anywhere
    }
    .issue-actions{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
    .home-dashboard .btn{
      min-height:46px;border-radius:12px;border:1px solid var(--line-strong);
      background:rgba(255,255,255,.82);padding:0 16px;color:var(--ink);
      font-size:14px;font-weight:700;box-shadow:none;
      transition:background .16s ease,border-color .16s ease,transform .12s ease
    }
    .home-dashboard .btn:hover{transform:none;background:var(--surface-strong);border-color:#aaa49a}
    .home-dashboard .btn:active{transform:translateY(1px)}
    .home-dashboard .btn.primary{padding-left:19px;padding-right:19px}
    .home-dashboard .btn.primary:hover{background:#000;border-color:#000}
    .home-dashboard .icon-button{
      width:46px;padding:0;border-color:transparent;background:transparent;
      color:var(--muted);letter-spacing:.06em
    }
    .home-dashboard .icon-button:hover{border-color:var(--line);color:var(--ink)}
    .issue-status{
      margin-top:19px;padding-top:14px;border-top:1px solid var(--line);
      color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:10px;line-height:1.5
    }
    .issue-reading{margin-top:16px;border-top:1px solid var(--line)}
    .reading-action{
      appearance:none;width:100%;border:0;background:transparent;padding:16px 0 13px;color:var(--ink);
      display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer
    }
    .reading-action:hover .reading-title{color:var(--accent)}
    .reading-copy{display:block;min-width:0}
    .reading-kicker{
      display:block;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700
    }
    .reading-title{display:block;margin-top:4px;font-size:17px;line-height:1.25;letter-spacing:-.012em;font-weight:700}
    .reading-meta{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.35}
    .reading-plus{
      width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;
      border:1px solid var(--line);border-radius:50%;background:#fff;font-size:22px;line-height:1;
      transition:transform .16s ease,border-color .16s ease
    }
    .reading-action:hover .reading-plus{transform:rotate(90deg);border-color:var(--line-strong)}
    .issue-footer{display:flex;justify-content:flex-start;border-top:1px solid var(--line)}
    .quiet-link{
      appearance:none;border:0;background:transparent;padding:12px 0 0;color:var(--muted);
      font-size:11px;font-weight:650;cursor:pointer
    }
    .quiet-link:hover{color:var(--ink)}
    .library-card{overflow:hidden}
    .library-head{padding:20px 20px 14px}

const fmtTime=value=>{try{return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(value))}catch{return ''}};
const fmtDuration=ms=>ms==null?'—':ms<1000?Math.round(ms)+'ms':(ms/1000).toFixed(ms<10000?1:0)+'s';
function maskEmail(value){
  if(!value)return 'Not connected';
  const parts=String(value).split('@');if(parts.length!==2)return value;
  const local=parts[0],domain=parts[1];
  const shown=local.slice(0,Math.min(2,local.length));
  return shown+'••••••@'+domain;
}


function latestRunText(job){
  if(!job)return 'No deliveries yet';
  const when=fmtTime(job.finished_at||job.updated_at||job.created_at);
  const articles=job.result?.articles;
  const articleText=articles!=null?` · ${articles} article${articles===1?'':'s'}`:'';
  if(job.status==='partial')return `Submitted with omissions · ${when}${articleText}`;
  if(job.status==='sent')return `Submitted · ${when}${articleText}`;
  if(job.status==='empty')return `Checked · ${when} · no new articles`;
  if(job.status==='failed')return `Last send failed · ${when}`;
  if(job.status==='running')return 'Building your issue…';
  if(job.status==='queued')return 'Send queued…';
  return `Last run · ${when} · ${String(job.status||'').toLowerCase()}`;
}

function openModal(content,variant='dialog'){
  if(!modal.classList.contains('open'))modalReturnFocus=document.activeElement;
  modalVersion++;modalDirty=false;
  modal.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="Long Form dialog" tabindex="-1">${content}</div>`;
  modal.classList.add('open');modal.classList.toggle('flow',variant==='flow');modal.setAttribute('aria-hidden','false');app.inert=true;
  const card=modal.querySelector('.modal-card'),heading=card.querySelector('h2');
  if(heading){heading.id='dialog-heading';card.setAttribute('aria-labelledby',heading.id)}
  card.addEventListener('input',()=>{modalDirty=!card.querySelector('#one-time-form')});
  modal.onclick=e=>{if(e.target===modal)closeModal()};
  modal.onkeydown=e=>{
    if(e.key==='Escape'){e.preventDefault();closeModal();return}
    if(e.key!=='Tab')return;
    const controls=[...card.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(el=>!el.closest('[hidden]'));
    const first=controls[0],last=controls.at(-1);
    if(!first){e.preventDefault();card.focus();return}
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===card)){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===card)){e.preventDefault();first.focus()}
  };
  card.focus();
  return modalVersion;
}
function closeModal(force=false){
  if(force!==true&&modalDirty&&!confirm('Discard unsaved changes?'))return;
  modalVersion++;modalDirty=false;modal.classList.remove('open','flow');modal.setAttribute('aria-hidden','true');modal.innerHTML='';app.inert=false;
  const target=modalReturnFocus?.isConnected?modalReturnFocus:document.getElementById(modalReturnFocus?.id||'');
  target?.focus();
}
async function api(path,options={}){
  const headers={'Content-Type':'application/json'};
  if(options.auth!==false&&token)headers.Authorization='Bearer '+token;
  const response=await fetch(API+path,{method:options.method||'GET',headers,signal:AbortSignal.timeout(options.timeout||100000),body:options.body?JSON.stringify(options.body):null});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw Object.assign(new Error(body.error||'Request failed'),{status:response.status});
  return body;
}

async function exchangeSupabaseSession(session){

  const response=await fetch(API+'/auth/exchange-supabase',{

    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token}
  });
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(body.error||'Could not complete social sign-in.');
  token=body.token;localStorage.setItem(TOKEN_KEY,token);state=body;

  return body;
}
async function socialSignIn(provider){

function feedStatus(feed){
  if(!feed.enabled)return '<span class="status off"><span class="dot"></span>Paused</span>';
  if(feed.last_error)return '<span class="status fail"><span class="dot"></span>Needs attention</span>';
  return '<span class="status"><span class="dot"></span>Active</span>';
}
function sourceContext(id){
  const feed=allSources().find(source=>source.id===id);
  return feed?{feed}:null;
}
function sourceNeedsAttention(feed){return Boolean(feed.last_error&&feed.enabled!==false)}
function sourceProblemLink(id){
  const context=sourceContext(id);if(!context)return '';
  return `<button class="source-problem-link review-source" data-id="${esc(id)}"><strong>${esc(displayText(context.feed.name||context.feed.url))}</strong><span class="source-problem-context">Recurring source</span><span class="source-problem-action">Review source →</span></button>`;
}
function wireSourceReviews(root=document){root.querySelectorAll('.review-source').forEach(button=>button.onclick=()=>reviewSource(button.dataset.id))}
function reviewSource(id){
  const context=sourceContext(id);if(!context){toast('This source is no longer available.');return}
  closeModal(true);sourcesExpanded=true;dashboard();
  const row=document.getElementById('feed-'+id);row?.scrollIntoView({block:'center'});row?.focus();
  feedActionsModal(id);
}
function feedRow(feed){
  return `<div class="feed" id="feed-${esc(feed.id)}" tabindex="-1">
    <div>
      <div class="feed-title">${esc(displayText(feed.name))} ${!feed.enabled?feedStatus(feed):''}</div>
      <div class="feed-url">${esc(feed.url)}</div>
      ${feed.last_error?`<div class="feed-error">${feed.enabled===false?'Last check failed (source paused)':'Last check failed'}: ${esc(feed.last_error)}</div><button class="section-attention review-source" data-id="${esc(feed.id)}">Review source →</button>`:''}
    </div>
    <div class="feed-actions">
      <button class="feed-manage manage-feed" data-id="${feed.id}" aria-label="Manage ${esc(displayText(feed.name))}">•••</button>
    </div>
  </div>`;
}

function nextIssueDelivery(){
  if(state.settings.paused)return 'Delivery paused';
  if(!state.settings.onboarding_complete||!state.settings.kindle_email)return 'Connect your Kindle';
  return state.settings.next_run_at?new Intl.DateTimeFormat('en-US',{timeZone:state.settings.timezone,weekday:'long',hour:'numeric',minute:'2-digit'}).format(new Date(state.settings.next_run_at)):'Not scheduled';
}

function runBadge(status){
  const cls=status==='failed'?'fail':['queued','running','partial'].includes(status)?'warn':'';
  return `<span class="status ${cls}"><span class="dot"></span>${esc(({sent:'Submitted',partial:'Submitted with omissions',empty:'No new articles',queued:'Queued',running:'Preparing',failed:'Failed'})[status]||status)}</span>`;
}

  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelectorAll('.choose-discovered-feed').forEach(button=>button.onclick=async()=>{
    const feed=feeds[Number(button.dataset.i)];button.disabled=true;
    try{state=await api('/feeds',{method:'POST',body:{url:feed.url}});closeModal(true);dashboard();toast('Source added')}
    catch(err){button.disabled=false;toast(err.message)}
  });
}
function feedActionsModal(id,checkMessage=''){
  const context=sourceContext(id);if(!context)return;
  const {feed}=context;
  openModal(`<div class="row"><div><div class="editorial-label">Source</div><h2 style="margin-top:6px">${esc(displayText(feed.name))}</h2><div class="source-context">${feed.enabled===false?'Source paused':'Recurring source'}</div></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <div class="technical-note" style="word-break:break-all;margin:8px 0 18px">${esc(feed.url)}</div>
    ${feed.last_error?`<div class="notice error" style="margin-bottom:14px"><strong>Last check failed.</strong> ${esc(feed.last_error)}${feed.last_fetch_at?`<div class="source-context">Checked ${esc(fmtDate(feed.last_fetch_at))}</div>`:''}</div>`:''}
    <div id="source-check-result" role="status" ${checkMessage?'':'hidden'} class="notice info">${esc(checkMessage)}</div>
    <p class="small muted">Recheck this source without sending anything to Kindle.${feed.enabled===false?' It will remain paused.':''}</p>
    <div class="row wrap" style="justify-content:flex-start">
      <button class="btn primary" id="manage-edit">Edit source</button>
      <button class="btn" id="manage-recheck">Check source again</button>
      <button class="btn" id="manage-toggle">${feed.enabled?'Pause':'Resume'}</button>
      <button class="btn danger" id="manage-delete">Delete</button>
    </div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#manage-edit').onclick=()=>sourceEditModal(id);
  document.querySelector('#manage-recheck').onclick=event=>recheckSource(id,event.currentTarget);
  document.querySelector('#manage-delete').onclick=()=>deleteFeedModal(id);
  document.querySelector('#manage-toggle').onclick=async()=>{
    try{state=await api('/feeds/'+id,{method:'PATCH',body:{enabled:!feed.enabled}});closeModal(true);dashboard();toast(feed.enabled?'Source paused':'Source resumed')}
    catch(err){toast(err.message)}
  };
}
function sourceEditModal(id){
  const context=sourceContext(id);if(!context)return;
  const {feed}=context;
  openModal(`<div class="row"><div><div class="editorial-label">Source</div><h2 style="margin-top:6px">Edit source</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Correct the name or feed address. Long Form validates the feed before saving it.</p>
    <form id="source-edit-form">
      <div class="field"><label for="source-edit-name">Name</label><input class="input" id="source-edit-name" name="name" maxlength="120" required value="${esc(feed.name||'')}"></div>
      <div class="field"><label for="source-edit-url">Website or RSS feed</label><input class="input" id="source-edit-url" name="url" type="url" required value="${esc(feed.url||'')}"></div>
      <div style="margin-top:16px"><button class="btn primary" id="source-edit-submit">Save source</button></div>
    </form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#source-edit-form').onsubmit=async e=>{
    e.preventDefault();
    const form=new FormData(e.currentTarget),button=document.querySelector('#source-edit-submit');
    button.disabled=true;button.textContent='Checking…';
    try{
      state=await api('/feeds/'+id,{method:'PATCH',body:{name:String(form.get('name')||'').trim(),url:String(form.get('url')||'').trim()}});
      closeModal(true);sourcesExpanded=true;dashboard();toast('Source updated');
    }catch(err){button.disabled=false;button.textContent='Save source';toast(err.message)}
  };
}

async function recheckSource(id,button){
  const version=modalVersion,sessionToken=token;
  button.disabled=true;button.textContent='Checking…';
  try{
    const response=await api('/feeds/'+id+'/check',{method:'POST'});
    if(token!==sessionToken||!state)return;
    state=response.dashboard;
    if(document.querySelector('.sources-list'))dashboard();
    if(version===modalVersion)feedActionsModal(id,response.result.error?'The source still needs attention. See the latest error above.':'Source is working. The warning has been cleared.');
  }catch(err){
    if(version!==modalVersion)return;
    const notice=document.querySelector('#source-check-result');notice.hidden=false;notice.textContent='Could not recheck this source: '+err.message;
    button.disabled=false;button.textContent='Check source again';
  }
}

function deleteFeedModal(id){
  const feed=allSources().find(f=>f.id===id);
  openModal(`<h2>Delete feed?</h2><p>This removes <strong>${esc(feed?.name||'this feed')}</strong> from future issues. Past delivery history remains.</p><div class="row wrap" style="justify-content:flex-start"><button class="btn danger" id="confirm-delete">Delete feed</button><button class="btn" id="cancel-delete">Cancel</button></div>`);
  document.querySelector('#cancel-delete').onclick=closeModal;
  document.querySelector('#confirm-delete').onclick=async()=>{
    try{state=await api('/feeds/'+id,{method:'DELETE'});closeModal(true);dashboard();toast('Feed deleted')}
    catch(err){toast(err.message)}
  };
}
function settingsModal(){
  const s=state.settings;
  openModal(`<div class="row"><h2>Kindle & delivery</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <form id="settings-form">
      <div class="field"><label>Send-to-Kindle address</label><input class="input" type="email" name="kindle_email" required value="${esc(s.kindle_email||'')}"></div>
      <div class="row wrap">
        <div class="field" style="flex:1;min-width:150px"><label>Daily delivery time</label><input class="input" type="time" name="delivery_time" value="${esc((s.delivery_time||'06:00').slice(0,5))}"></div>
        <div class="field" style="flex:2;min-width:220px"><label>Timezone</label><input class="input" name="timezone" value="${esc(s.timezone)}"></div>
      </div>
      <p class="small muted">One issue is sent per day. Every enabled source participates; the editor creates fresh issue sections automatically.</p>
      <div class="notice info">Need to change Amazon setup? <a href="${AMAZON_SETTINGS}" target="_blank" rel="noopener"><strong>Open Personal Document Settings ↗</strong></a></div>
      <div style="margin-top:16px"><button class="btn primary">Save settings</button></div>

    e.preventDefault();const form=new FormData(e.currentTarget);

    catch(err){toast(err.message)}

async function previewModal(){
  const version=openModal('<div class="row"><h2>Latest articles</h2><button class="btn small-btn" id="close-modal">Close</button></div><p class="muted">Checking your active feeds…</p>');
  document.querySelector('#close-modal').onclick=closeModal;
  try{
    const result=await api('/preview',{method:'POST'});
    if(version!==modalVersion)return;
    const items=result.items||[];
    const failures=(result.feeds||[]).filter(feed=>feed.error);
    for(const checked of result.feeds||[]){
      const context=sourceContext(checked.feed_id);if(!context)continue;
      context.feed.last_error=checked.error||null;
    }
    if(document.querySelector('.sources-list'))dashboard();
    openModal(`<div class="row"><h2>Latest articles</h2><button class="btn small-btn" id="close-modal">Close</button></div>
      <p class="muted small">${items.length} recent item${items.length===1?'':'s'} across active feeds. Headline browser only: it does not show Kindle formatting or filter already-delivered articles. Nothing was sent.</p>
      ${failures.map(f=>`<div class="notice error">${sourceProblemLink(f.feed_id)||'<strong>Source unavailable</strong>'}<p>${esc(f.error)}</p></div>`).join('')}<div class="preview-list">${items.slice(0,40).map(item=>`<div class="preview-item"><a href="${esc(safeHref(item.url))}" target="_blank" rel="noopener">${esc(item.title)}</a><div class="preview-source">${esc(item.source)}${item.published_at?' · '+fmtDate(item.published_at):''}</div></div>`).join('')||`<p class="muted">${failures.length?'No articles could be shown. Review the source errors above.':'No recent articles found.'}</p>`}</div>`);
    document.querySelector('#close-modal').onclick=closeModal;
    wireSourceReviews(modal);
  }catch(err){if(version!==modalVersion)return;modal.querySelector('.modal-card').innerHTML=`<h2>Preview unavailable</h2><div class="notice error">${esc(err.message)}</div><div style="margin-top:16px"><button class="btn" id="close-modal">Close</button></div>`;document.querySelector('#close-modal').onclick=closeModal}
}
function oneTimeEditionModal(seed){
  seed=seed||oneTimeDraft||{};
  const name=seed.name||'',urls=seed.urls||'';
  oneTimeDraft={name,urls,request_id:seed.request_id||crypto.randomUUID()};
  if(!state.settings.kindle_email){oneTimeKindleSetup();return}
  openModal(`<div class="row"><div><div class="editorial-label">Next issue</div><h2 style="margin-top:6px">Add selected articles</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Paste one article URL or several. They will be added as a named section in your next daily issue. This will not add a recurring feed.</p>
    <form id="one-time-form">
      <div class="field"><label for="one-time-name">Section name</label><input class="input" id="one-time-name" name="name" maxlength="80" required placeholder="Weekend reading" value="${esc(name)}"></div>
      <div class="field"><label for="one-time-urls">Article URLs <span class="muted">(1–20)</span></label><textarea class="input article-urls" id="one-time-urls" name="urls" required placeholder="https://example.com/article-one&#10;https://example.com/article-two">${esc(urls)}</textarea></div>
      <div class="notice info">Review the extracted text before sending. Images are checked during preparation; JPEG, PNG and GIF are supported. Article drafts stay available until you sign out or reload.</div>
      <div style="margin-top:16px"><button class="btn primary" id="review-one-time">Review articles</button></div>
    </form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  const version=modalVersion;
  document.querySelector('#one-time-form').oninput=()=>{oneTimeDraft={name:document.querySelector('#one-time-name').value,urls:document.querySelector('#one-time-urls').value,request_id:crypto.randomUUID()}};
  document.querySelector('#one-time-form').onsubmit=async event=>{
    event.preventDefault();
    const form=new FormData(event.currentTarget),editionName=String(form.get('name')||'').trim(),raw=String(form.get('urls')||'').trim();
    const articleUrls=[...new Set(raw.split(/\s+/).map(value=>value.trim()).filter(Boolean))];
    if(!editionName||articleUrls.length<1||articleUrls.length>20){toast('Add a name and between 1 and 20 article URLs.');return}
    const button=document.querySelector('#review-one-time');button.disabled=true;button.textContent='Checking articles…';
    try{
      const result=await api('/one-time/preview',{method:'POST',body:{name:editionName,urls:articleUrls}});
      if(version===modalVersion)oneTimeReview(result.name,result.items||[]);
    }catch(err){button.disabled=false;button.textContent='Review articles';toast(err.message)}
  };
}
function oneTimeReview(name,items){
  oneTimeDraft={name,urls:items.map(item=>item.url).join('\n'),request_id:oneTimeDraft?.request_id||crypto.randomUUID()};
  const failed=items.filter(item=>item.status!=='ready').length;
  openModal(`<div class="row"><div><div class="editorial-label">Next issue</div><h2 style="margin-top:6px">${esc(name)}</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Review the excerpts and order. This checks article text, not the final EPUB. Articles are fetched again when preparing the send; images or publisher content may change.</p>
    <div class="one-time-list">${items.map((item,index)=>`<div class="one-time-item">
      <div><div class="one-time-item-title">${esc(item.title||`Article ${index+1}`)}</div><div class="one-time-item-url">${esc(item.canonical_url||item.url)}</div>${item.source?`<div class="preview-source">${esc(item.source)}${item.author?' · '+esc(item.author):''}</div>`:''}${item.excerpt?`<p class="small">${esc(item.excerpt)}</p>`:''}${(item.warnings||[]).map(w=>`<p class="notice info">${esc(w)}</p>`).join('')}${item.error?`<div class="one-time-item-error">Could not prepare: ${esc(item.error)}</div>`:''}</div>
      <div class="one-time-item-actions"><button class="btn small-btn one-time-up" data-index="${index}" ${index===0?'disabled':''} aria-label="Move article up">↑</button><button class="btn small-btn one-time-down" data-index="${index}" ${index===items.length-1?'disabled':''} aria-label="Move article down">↓</button><button class="btn small-btn one-time-remove" data-index="${index}" aria-label="Remove article">Remove</button></div>
    </div>`).join('')}</div>
    ${failed?`<div class="notice error" style="margin-top:14px">${failed} article${failed===1?' could':'s could'} not be prepared. Remove ${failed===1?'it':'them'} or go back and correct the URL${failed===1?'':'s'}.</div>`:''}
    <div class="one-time-summary"><p class="muted small">${items.length} article${items.length===1?'':'s'} · added once</p><div class="row wrap"><button class="btn" id="edit-one-time">Edit URLs</button><button class="btn primary" id="confirm-one-time" ${failed||!items.length?'disabled':''}>Add to next issue</button></div></div>`,'flow');
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#edit-one-time').onclick=()=>oneTimeEditionModal(oneTimeDraft);
  document.querySelectorAll('.one-time-up').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.index);[items[index-1],items[index]]=[items[index],items[index-1]];oneTimeDraft.request_id=crypto.randomUUID();oneTimeReview(name,items)});
  document.querySelectorAll('.one-time-down').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.index);[items[index+1],items[index]]=[items[index],items[index+1]];oneTimeDraft.request_id=crypto.randomUUID();oneTimeReview(name,items)});
  document.querySelectorAll('.one-time-remove').forEach(button=>button.onclick=()=>{items.splice(Number(button.dataset.index),1);oneTimeDraft.request_id=crypto.randomUUID();oneTimeReview(name,items)});
  const confirm=document.querySelector('#confirm-one-time');if(confirm)confirm.onclick=()=>queueOneTime(name,items.map(item=>item.url),confirm);
}
async function queueOneTime(name,urls,button){
  button.disabled=true;button.textContent='Adding…';
  try{
    await api('/one-time/send',{method:'POST',body:{name,urls,request_id:oneTimeDraft?.request_id||crypto.randomUUID()}});
    oneTimeDraft=null;closeModal(true);toast('Added to your next issue');
  }catch(err){button.disabled=false;button.textContent='Add to next issue';toast(err.message)}
}
function showJobProgress(result,title){
  openModal(`<div class="row"><h2>${esc(title)}</h2><button class="btn small-btn" id="close-modal">Close</button></div><div class="notice info" id="job-progress" data-job-id="${result.job.id}" role="status">Queued for preparation.</div><p class="muted small">You can close this window. Delivery history keeps the latest status. “Submitted” means the email provider accepted the issue, not that Amazon has confirmed arrival on your Kindle.</p>`);
  document.querySelector('#close-modal').onclick=closeModal;
}
async function queueSend(path,message){
  const version=modalVersion;
  const button=path==='/send-test'?document.querySelector('#send-test'):document.querySelector('#send-now');
  const old=button?.textContent||'';if(button){button.disabled=true;button.textContent='Queuing…'}
  if(!pendingSends.has(path))pendingSends.set(path,crypto.randomUUID());
  try{
    const result=await api(path,{method:'POST',body:{request_id:pendingSends.get(path)}});
    pendingSends.delete(path);
    state.jobs=[result.job,...(state.jobs||[]).filter(j=>j.id!==result.job.id)];
    if(app.querySelector('.home-dashboard,.dashboard-main'))dashboard();
    if(version===modalVersion)showJobProgress(result,message);else toast(message);
    void watchJob(result.job.id);
  }catch(err){toast(err.message)}
  finally{if(button){button.disabled=false;button.textContent=old}}
}
function jobProgressText(job){
  if(job.status==='queued')return job.error?'Retry scheduled for '+fmtDate(job.run_after)+'. '+job.error:'Queued — waiting for preparation.';
  if(job.status==='running')return 'Building your Kindle issue…';
  if(job.status==='sent'||job.status==='partial')return `Submitted for delivery · ${job.result?.articles??0} articles.${job.status==='partial'?' Some content was omitted; see delivery history.':''}`;
  if(job.status==='empty')return job.result?.note||'No new articles to send.';
  return 'Send failed: '+(job.error||'Unknown error');
}
async function watchJob(jobId){
  if(activeWatchers.has(jobId))return;
  activeWatchers.add(jobId);
  const watchToken=token;
  const deadline=Date.now()+180000;
  try{
    while(Date.now()<deadline&&token===watchToken&&token){
      try{
        const fresh=await api('/me',{timeout:15000});
        if(!token||token!==watchToken)return;
        state=fresh;
        const job=(state.jobs||[]).find(j=>j.id===jobId);
        const box=modal.querySelector('#job-progress');
        if(box?.dataset.jobId===jobId&&job)box.textContent=jobProgressText(job);
        if(app.querySelector('.home-dashboard,.dashboard-main'))dashboard();
        if(job&&['sent','partial','empty','failed'].includes(job.status))return;
      }catch{}
      await new Promise(r=>setTimeout(r,2500));
    }
    const box=modal.querySelector('#job-progress');
    if(box?.dataset.jobId===jobId)box.textContent='Still processing. Delivery history shows the latest status; close this window whenever you like.';
  }finally{activeWatchers.delete(jobId)}
}
function oneTimeKindleSetup(){
  openModal(`<div class="row"><h2>Where should your issue go?</h2><button class="btn small-btn" id="close-modal">Close</button></div><p>Add <strong>${SENDER}</strong> to Amazon’s approved personal-document senders, then enter your Kindle address. No schedule or test issue will be created.</p><p><a href="${AMAZON_SETTINGS}" target="_blank" rel="noopener">Open Amazon settings ↗</a></p><form id="one-time-kindle"><div class="field"><label for="packet-kindle-email">Send-to-Kindle address</label><input class="input" id="packet-kindle-email" type="email" required></div><button class="btn primary">Save & choose articles</button></form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#one-time-kindle').onsubmit=async event=>{
    event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;
    const version=modalVersion;
    try{
      state=await api('/settings',{method:'PATCH',body:{kindle_email:document.querySelector('#packet-kindle-email').value.trim(),...(!state.settings.onboarding_complete?{onboarding_complete:true,paused:true}:{})}});
      modalDirty=false;dashboard();if(version===modalVersion)oneTimeEditionModal();
    }catch(err){toast(err.message);button.disabled=false}
  };
}
async function historyModal(){
  const version=openModal('<div class="row"><h2>Delivery history</h2><button class="btn small-btn" id="close-modal">Close</button></div><p>Loading recent sends…</p>');
  document.querySelector('#close-modal').onclick=closeModal;
  try{state=await api('/me')}catch(err){if(version===modalVersion)toast(err.message)}
  if(version!==modalVersion)return;
  openModal(`<div class="row"><h2>Delivery history</h2><button class="btn small-btn" id="close-modal">Close</button></div><p class="muted small">Most recent 15 sends. Submitted means accepted by the email provider; Kindle arrival is not verified.</p><div class="preview-list">${(state.jobs||[]).map(job=>`<div class="preview-item"><strong>${esc(job.packet_name||job.edition_name||({scheduled:'Daily issue',manual:'Manual issue',test:'Test issue'})[job.reason]||'Issue')}</strong> ${runBadge(job.status)}<p class="small">${esc(fmtDate(job.created_at))} · ${esc(jobProgressText(job))}</p>${(job.result?.issues||[]).map(issue=>`<p class="notice info">${esc(issue)}</p>`).join('')}${job.reason==='one_time'&&job.article_urls?.length?`<button class="btn small-btn resend-packet" data-id="${job.id}">Review & add to next issue</button>`:''}</div>`).join('')||'<p>No sends yet.</p>'}</div><button class="btn small-btn" id="refresh-history">Refresh status</button>`);
  document.querySelector('#close-modal').onclick=closeModal;document.querySelector('#refresh-history').onclick=historyModal;
  modal.querySelectorAll('.resend-packet').forEach(button=>button.onclick=()=>{const job=state.jobs.find(j=>j.id===button.dataset.id);oneTimeEditionModal({name:job.packet_name,urls:job.article_urls.join('\n'),request_id:crypto.randomUUID()})});
}
function render(){
  if(state?.settings?.onboarding_complete){dashboard();const active=(state.jobs||[]).find(j=>['queued','running'].includes(j.status));if(active)void watchJob(active.id);return}
  if(feedCount()===0&&(localStorage.getItem(SKIP_STARTERS_KEY)||localStorage.getItem(LEGACY_SKIP_STARTERS_KEY))!=='1')return starterPicker();
  if(feedCount()===0)return dashboard();
  return onboarding();
}

function sessionUnavailable(){
  app.innerHTML=shell(`<section class="auth-page"><div class="auth-hero">
    <h1>Couldn’t load Long Form.</h1>
    <p>Your sign-in is saved. Check your connection and try again.</p>
    <button class="btn primary" id="retry-session">Try again</button>
  </div></section>`);
  document.querySelector('#retry-session').onclick=async event=>{
    event.currentTarget.disabled=true;
    await startApp();
  };
}
async function startApp(){
  let loginError='';
  const params=new URLSearchParams(location.search);
  if(params.get('error_description'))loginError=params.get('error_description');
  if(token){
    try{state=await api('/me')}
    catch(err){
      if(err.status!==401){sessionUnavailable();return}
      token='';localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(LEGACY_TOKEN_KEY);state=null;
      landing('Your session has ended. Sign in to continue.');return;
    }
    render();return;
  }
  if(SOCIAL_AUTH_ENABLED&&authClient){
    try{
      const {data,error}=await authClient.auth.getSession();
      if(error)throw error;
      if(data?.session){
        await exchangeSupabaseSession(data.session);
        render();return;
      }
    }catch(err){loginError=loginError||err.message||'Could not complete social sign-in.'}
  }
  landing(loginError);
}
(async()=>{
  await startApp();
})();
</script>
