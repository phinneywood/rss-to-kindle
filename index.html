<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Reader</title><style>body{margin:0;background:#f5f1e8;color:#1f1c17;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:900px;margin:auto;padding:24px 16px 64px}header,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.brand,h1,h2{font-family:Georgia,serif}.brand{font-size:24px;font-weight:700}h1{font-size:clamp(46px,9vw,76px);line-height:.95;letter-spacing:-.05em;margin:45px 0 16px}h2{font-size:28px;margin:4px 0 12px}.muted{color:#6d665b}.card{background:#fffdf8;border:1px solid #d8cfbe;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 15px 40px #332a1f10}.input{width:100%;padding:12px;border:1px solid #d8cfbe;border-radius:10px;margin:6px 0}.btn{border:1px solid #d8cfbe;border-radius:999px;background:#fff;padding:9px 13px;font-weight:700}.primary{background:#174f3c;color:#fff;border-color:#174f3c}.danger{color:#9b2c2c}.feed{padding:10px 0;border-top:1px solid #ece4d6}.small{font-size:12px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.status{font-size:11px;padding:4px 8px;border-radius:999px;background:#e4ece5;color:#174f3c;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-wrap:wrap}}</style><div id="a"></div><script>
const A='https://wuikfmmwvrzpaoevtskn.supabase.co/functions/v1/app-api',S='reader@antonioskilton.com',a=document.querySelector('#a');let t=localStorage.mr||'',D;const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sh=(b,x='')=>`<main><header><div class="brand">☼ Morning Reader</div>${x}</header>${b}<p class="small muted">Free beta · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="https://github.com/phinneywood/rss-to-kindle">Source</a></p></main>`;async function q(p,o={}){let h={'Content-Type':'application/json'};if(o.auth!==false&&t)h.Authorization='Bearer '+t;let r=await fetch(A+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):null}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function land(e=''){a.innerHTML=sh(`<h1>Your feeds.<br>Your Kindle.<br>Every morning.</h1><p class="muted">RSS and Atom posts, turned into clean EPUBs on your schedule. No ranking or summaries.</p><form id="f" class="card" style="max-width:460px"><h2>Sign in</h2><input class="input" name="email" type="email" required placeholder="you@example.com">${e?`<p class="danger">${E(e)}</p>`:''}<button class="btn primary">Email me a code</button></form>`);f.onsubmit=async e=>{e.preventDefault();let m=new FormData(f).get('email');try{await q('/auth/request-code',{method:'POST',body:{email:m},auth:false});verify(m)}catch(x){land(x.message)}}}
function verify(m,e=''){a.innerHTML=sh(`<h1>Check your inbox.</h1><form id="f" class="card" style="max-width:460px"><p>Code sent to <b>${E(m)}</b></p><input class="input" name="code" inputmode="numeric" maxlength="6" required placeholder="123456">${e?`<p class="danger">${E(e)}</p>`:''}<button class="btn primary">Continue</button></form>`);f.onsubmit=async x=>{x.preventDefault();try{let d=await q('/auth/verify-code',{method:'POST',body:{email:m,code:new FormData(f).get('code')},auth:false});t=d.token;localStorage.mr=t;D=d;render()}catch(z){verify(m,z.message)}}}
function out(){q('/auth/logout',{method:'POST'}).catch(()=>{});t='';delete localStorage.mr;land()}function setup(){let s=D.settings,z=Intl.DateTimeFormat().resolvedOptions().timeZone||s.timezone||'UTC';a.innerHTML=sh(`<form id="f" class="card" style="max-width:650px;margin:45px auto"><h2>Connect your Kindle</h2><p class="muted">Add ${S} to Amazon’s Approved Personal Document E-mail List.</p><input class="input" name="k" type="email" placeholder="you@kindle.com" required><div class="row"><input class="input" name="tm" type="time" value="06:00"><input class="input" name="tz" value="${E(z)}"></div><button class="btn primary">Finish setup</button></form>`,`<button class="btn" onclick="out()">Sign out</button>`);f.onsubmit=async e=>{e.preventDefault();let x=new FormData(f);try{D=await q('/settings',{method:'PATCH',body:{kindle_email:x.get('k'),delivery_time:x.get('tm'),timezone:x.get('tz'),onboarding_complete:true}});dash()}catch(z){alert(z.message)}}}
function feed(f){return `<div class="feed"><b>${E(f.name)}</b><div class="small muted">${E(f.url)}</div><div class="row"><span class="status">${f.enabled?'Active':'Off'}</span><button class="btn tg" data-i="${f.id}" data-o="${f.enabled}">${f.enabled?'Pause':'Enable'}</button><button class="btn danger df" data-i="${f.id}">Delete</button></div></div>`}function section(s){return `<div class="card"><div class="row"><h2>${E(s.name)}</h2><button class="btn af" data-i="${s.id}">+ Feed</button></div>${s.feeds.length?s.feeds.map(feed).join(''):'<p class="muted">No feeds yet.</p>'}</div>`}
function dash(){let s=D.settings,n=D.sections.flatMap(x=>x.feeds).length;a.innerHTML=sh(`<div class="row" style="margin-top:35px"><div><h2>Good morning.</h2><div class="small muted">${E(D.user.email)}</div></div><div class="row"><button class="btn" id="test">Send test</button><button class="btn primary" id="now">Send now</button></div></div><div class="grid"><div><div class="row"><h2>Sections & feeds</h2><button class="btn" id="as">+ Section</button></div>${D.sections.map(section).join('')}</div><aside><div class="card"><div class="small muted">Next delivery</div><h2>${E((s.delivery_time||'06:00').slice(0,5))}</h2><div class="small muted">${E(s.timezone)}</div><p><span class="status">${s.paused?'Paused':'Scheduled'}</span></p><button class="btn" id="pause">${s.paused?'Resume':'Pause'}</button></div><div class="card"><div class="small muted">Kindle</div><b>${E(s.kindle_email)}</b><p class="small muted">${n} feeds · sender ${S}</p></div><div class="card"><h2>Recent runs</h2>${(D.jobs||[]).slice(0,6).map(j=>`<p><b>${E(j.reason)} · ${E(j.status)}</b><br><span class="small muted">${new Date(j.created_at).toLocaleString()}${j.result?.articles!=null?' · '+j.result.articles+' articles':''}</span></p>`).join('')||'<p class="muted">None yet.</p>'}</div></aside></div>`,`<button class="btn" onclick="out()">Sign out</button>`);wire()}
function wire(){as.onclick=async()=>{let n=prompt('Section name');if(!n)return;try{D=await q('/sections',{method:'POST',body:{name:n}});dash()}catch(e){alert(e.message)}};pause.onclick=async()=>{D=await q('/settings',{method:'PATCH',body:{paused:!D.settings.paused}});dash()};test.onclick=()=>send('/send-test');now.onclick=()=>send('/send-now');document.querySelectorAll('.af').forEach(b=>b.onclick=()=>add(b.dataset.i));document.querySelectorAll('.df').forEach(b=>b.onclick=()=>del(b.dataset.i));document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>tog(b.dataset.i,b.dataset.o==='true'))}
async function add(id){let u=prompt('RSS or Atom URL');if(!u)return;try{D=await q('/feeds',{method:'POST',body:{section_id:id,url:u}});dash()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete feed?'))return;D=await q('/feeds/'+id,{method:'DELETE'});dash()}async function tog(id,on){D=await q('/feeds/'+id,{method:'PATCH',body:{enabled:!on}});dash()}async function send(p){try{await q(p,{method:'POST'});alert('Queued. Refreshing shortly.');setTimeout(async()=>{D=await q('/me');dash()},3000)}catch(e){alert(e.message)}}function render(){D.settings?.onboarding_complete?dash():setup()}(async()=>{if(!t)return land();try{D=await q('/me');render()}catch{land()}})();
</script>
