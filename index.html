<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <meta name="description" content="Turn RSS and Atom feeds into calm, sectioned Kindle editions on your schedule.">
  <title>Morning Reader</title>
  <style>
    :root{
      --bg:#f4efe5;
      --paper:#fffdf8;
      --ink:#1e1b17;
      --muted:#71695e;
      --line:#d8cfbf;
      --line-soft:#ebe4d8;
      --green:#174f3c;
      --green-2:#0e3b2c;
      --green-soft:#e6efe9;
      --amber:#8a5b12;
      --amber-soft:#f8edd7;
      --red:#9b2f2f;
      --red-soft:#f7e6e4;
      --shadow:0 18px 50px rgba(62,47,27,.08);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
      radial-gradient(circle at 15% 0%,rgba(255,255,255,.8),transparent 30rem),var(--bg)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .shell{max-width:1080px;margin:0 auto;padding:24px 18px 70px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:-.02em}
    .sun{width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;font-family:system-ui;font-size:14px}
    .top-actions{display:flex;gap:8px;align-items:center}
    .hero{padding:74px 0 36px;max-width:760px}
    .eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--green)}
    h1,h2,h3{font-family:Georgia,serif;letter-spacing:-.025em}
    h1{font-size:clamp(48px,8vw,82px);line-height:.95;margin:13px 0 20px;font-weight:600}
    h2{font-size:30px;line-height:1.05;margin:0 0 12px}
    h3{font-size:20px;margin:0}
    p{line-height:1.55}
    .lede{font-size:19px;max-width:650px;color:var(--muted);margin:0}
    .muted{color:var(--muted)}
    .tiny{font-size:12px}
    .small{font-size:14px}
    .card{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
    .auth-card{max-width:480px;margin-top:26px}
    .field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
    .field label{font-size:13px;font-weight:750}
    .input,.select{width:100%;background:white;border:1px solid #cfc4b2;border-radius:12px;padding:12px 13px;color:var(--ink);outline:none;transition:.15s border-color,.15s box-shadow}
    .input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,79,60,.1)}
    .btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:10px 15px;font-weight:760;transition:.15s transform,.15s background,.15s border-color}
    .btn:hover{transform:translateY(-1px);border-color:#bdb09c}
    .btn:active{transform:translateY(0)}
    .btn.primary{background:var(--green);border-color:var(--green);color:white}
    .btn.primary:hover{background:var(--green-2)}
    .btn.danger{color:var(--red)}
    .btn.ghost{background:transparent}
    .btn.small-btn{padding:7px 11px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:default;transform:none}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .wrap{flex-wrap:wrap}
    .stack{display:flex;flex-direction:column;gap:12px}
    .grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:20px;margin-top:24px}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
    .stat{background:rgba(255,253,248,.7);border:1px solid var(--line);border-radius:16px;padding:16px}
    .stat .value{font-family:Georgia,serif;font-size:26px}
    .section-card{padding:0;overflow:hidden}
    .section-head{padding:20px 20px 16px}
    .section-name{display:flex;align-items:center;gap:10px}
    .feed-list{border-top:1px solid var(--line-soft)}
    .feed{padding:15px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line-soft)}
    .feed:first-child{border-top:none}
    .feed-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .feed-url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px;margin-top:4px}
    .feed-actions{display:flex;align-items:center;gap:7px}
    .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;background:var(--green-soft);color:var(--green)}
    .status.off{background:#eeeae2;color:#6f685d}
    .status.warn{background:var(--amber-soft);color:var(--amber)}
    .status.fail{background:var(--red-soft);color:var(--red)}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .empty{padding:24px 20px;color:var(--muted)}
    .side-card{margin-bottom:14px}
    .side-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted);margin-bottom:10px}
    .delivery-time{font-family:Georgia,serif;font-size:38px;margin:0}
    .timeline{display:flex;flex-direction:column}
    .run{padding:12px 0;border-top:1px solid var(--line-soft)}
    .run:first-child{border-top:none;padding-top:0}
    .run-title{font-weight:750}
    .run-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .onboarding{max-width:760px;margin:52px auto 0}
    .step{display:grid;grid-template-columns:36px 1fr;gap:15px;padding:18px 0;border-top:1px solid var(--line-soft)}
    .step:first-of-type{border-top:none}
    .step-num{width:32px;height:32px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-weight:850}
    .step h3{margin:1px 0 6px}
    .codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3eee4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .codebox code{overflow:hidden;text-overflow:ellipsis}
    .inline-form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 20px;background:#fbf7ef;border-top:1px solid var(--line-soft)}
    .notice{border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.45}
    .notice.info{background:var(--green-soft);color:#153e30}
    .notice.error{background:var(--red-soft);color:var(--red)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:44px}
    .toolbar h2{margin:0}
    .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:rgba(35,28,20,.38);backdrop-filter:blur(4px);z-index:30}
    .modal.open{display:grid}
    .modal-card{width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 100px rgba(36,27,15,.24);padding:22px}
    .preview-list{display:flex;flex-direction:column;gap:0}
    .preview-item{padding:14px 0;border-top:1px solid var(--line-soft)}
    .preview-item:first-child{border-top:none}
    .preview-item a{text-decoration:none;font-weight:760}
    .preview-source{font-size:12px;color:var(--muted);margin-top:4px}
    .toast{position:fixed;right:18px;bottom:18px;max-width:360px;background:#1f1b17;color:white;border-radius:14px;padding:13px 15px;box-shadow:0 15px 60px rgba(0,0,0,.25);z-index:50;display:none}
    .toast.show{display:block}
    footer{margin-top:38px;padding-top:18px;border-top:1px solid rgba(126,111,92,.25);color:var(--muted);font-size:12px}
    footer a{margin-right:15px}
    [hidden]{display:none!important}
    .content-section{display:flex;flex-direction:column;gap:12px}
    .content-section + .content-section{margin-top:30px}
    .section-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .section-intro h2{margin:0}
    .section-copy{font-size:14px;color:var(--muted);line-height:1.5;margin-top:5px;max-width:620px}
    .feed-intake{padding:20px}
    .feed-intake-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
    .feed-intake-head h2{margin:0}
    .feed-intake-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px) auto;gap:10px;align-items:end}
    .feed-intake-form .field{margin:0;min-width:0}
    .feed-intake-form .btn{min-height:43px}
    .section-card{padding:0;overflow:hidden}
    .section-head{padding:17px 18px}
    .section-name{display:flex;align-items:baseline;gap:8px;min-width:0}
    .section-name h3{font-size:22px}
    .section-meta{font-size:13px;color:var(--muted);white-space:nowrap}
    .disclosure-btn{width:36px;height:36px;padding:0!important;display:grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto}
    .edition-manage{display:flex;align-items:center;justify-content:flex-end;padding:10px 18px;background:#fbf7ef;border-top:1px solid var(--line-soft)}
    @media(max-width:760px){
      .shell{padding:18px 14px 58px}
      .hero{padding-top:50px}
      .grid{grid-template-columns:1fr}
      .stat-grid{grid-template-columns:1fr 1fr}
      .stat-grid .stat:last-child{grid-column:1/-1}
      .feed{grid-template-columns:1fr}
      .feed-actions{justify-content:flex-start;flex-wrap:wrap}
      .toolbar{align-items:flex-start;flex-direction:column}
      .feed-intake{padding:18px}
      .feed-intake-head{flex-direction:column;margin-bottom:14px}
      .feed-intake-form{grid-template-columns:1fr}
      .source-actions{grid-template-columns:1fr;max-width:none}
      .source-action{width:100%}

      .feed-intake-form .btn{width:100%}
      .section-intro{align-items:flex-start}
      .section-head{padding:16px}
      .section-name{gap:7px}
      .section-name h3{font-size:21px}
      .inline-form{grid-template-columns:1fr}
      .topbar{align-items:flex-start}
    }

    /* Editorial UI: Economist-inspired, technical, mobile-first */
    :root{
      --bg:#f7f5ef;
      --paper:#fff;
      --ink:#11110f;
      --muted:#67645e;
      --line:#bdb9b0;
      --line-soft:#dfdcd5;
      --green:#0d5f4c;
      --green-2:#09483a;
      --green-soft:#eaf2ef;
      --red:#b3131b;
      --red-soft:#f8eaea;
      --shadow:none;
      --radius:2px;
    }
    html,body{background:var(--bg)}
    body{background:var(--bg)}
    .shell{max-width:1040px;padding:22px 20px 64px}
    .topbar{padding-bottom:18px;border-bottom:1px solid var(--ink)}
    .brand-wrap{min-width:0}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1}
    .brand-kicker{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .sun{display:none}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none}
    .btn{border-radius:2px;padding:9px 13px;background:transparent;border:1px solid var(--line);font-weight:700}
    .btn:hover{transform:none;border-color:var(--ink);background:#fff}
    .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
    .btn.primary:hover{background:#920d14;border-color:#920d14}
    .btn.small-btn{padding:7px 10px;font-size:12px}
    .input,.select{border-radius:2px;border-color:var(--line);padding:11px 12px;background:#fff}
    .input:focus,.select:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
    .eyebrow,.side-title,.editorial-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--ink)}
    .editorial-section{padding:26px 0;border-bottom:1px solid var(--ink)}
    .editorial-section:first-child{padding-top:6px}
    .editorial-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
    .editorial-head h1,.editorial-head h2{margin:4px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.035em}
    .editorial-head h1{font-size:46px;line-height:1}
    .editorial-head h2{font-size:36px;line-height:1}
    .editorial-copy{max-width:630px;color:#494741;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.45;margin-top:10px}
    .intake-actions{display:flex;gap:8px;align-items:center}
    .source-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;max-width:560px}
    .source-action{min-height:54px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px}
    .source-action strong{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:600}
    .source-action span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

    .feed-intake{padding:0;border:0;background:transparent}
    .feed-intake-head{display:none}
    .feed-intake-form{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:8px;align-items:end}
    .feed-intake-form .field{margin:0}
    .field label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .technical-note{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);margin-top:9px}
    .editions-list{border-top:1px solid var(--line)}
    .section-card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
    .section-head{padding:15px 0}
    .edition-index{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);font-size:13px;font-weight:800;width:34px;flex:0 0 34px}
    .section-name{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
    .section-name h3{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:600;letter-spacing:-.025em}
    .section-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
    .disclosure-btn{border:0;background:transparent;width:34px;height:34px;padding:0!important;font-size:18px}
    .disclosure-btn:hover{background:transparent}
    .edition-details{border-top:1px solid var(--line-soft);padding:0 0 10px 34px}
    .edition-manage{display:flex;justify-content:flex-end;padding:9px 0;background:transparent;border:0}
    .feed-list{border-top:0}
    .feed{padding:12px 0;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    .feed:first-child{border-top:1px solid var(--line-soft)}
    .feed-title{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:600}
    .feed-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;margin-top:3px}
    .feed-actions{display:flex;align-items:center}
    .feed-manage{border:0;padding:5px 7px;font-size:18px;letter-spacing:.08em;background:transparent}
    .status{border-radius:2px;padding:4px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
    .empty{padding:16px 0}
    .new-edition-row{display:flex;justify-content:flex-start;padding-top:14px}
    .delivery-block{padding:0}
    .delivery-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
    .delivery-time{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1}
    .delivery-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);margin-top:6px}
    .delivery-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .latest-run{margin-top:15px;padding-top:12px;border-top:1px solid var(--line-soft);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted)}
    .problem-banner{border-left:3px solid var(--red);padding:10px 12px;margin:0 0 18px;background:#fff;font-size:12px}
    .grid.editorial-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.75fr);gap:28px;margin-top:28px}
    .side-card{border:0;border-top:1px solid var(--ink);padding:18px 0;margin:0;background:transparent}
    .side-card + .side-card{margin-top:18px}
    footer{border-top:1px solid var(--ink);padding-top:15px}
    @media(max-width:760px){
      .shell{padding:16px 16px 48px}
      .topbar{padding-bottom:14px}
      .brand{font-size:27px}
      .brand-kicker{font-size:9px}
      .grid.editorial-grid{grid-template-columns:1fr;gap:0;margin-top:18px}
      .editorial-section{padding:22px 0}
      .editorial-head{display:block;margin-bottom:14px}
      .editorial-head h1{font-size:39px}
      .editorial-head h2{font-size:32px}
      .editorial-copy{font-size:16px;margin-top:8px}
      .intake-actions{margin-top:14px}
      .feed-intake-form{grid-template-columns:1fr}
      .feed-intake-form .btn{width:100%}
      .section-head{padding:14px 0}
      .section-name{display:block}
      .section-name h3{font-size:24px}
      .section-meta{display:block;margin-top:3px}
      .edition-details{padding-left:0}
      .feed{padding:12px 0}
      .feed-title{font-size:17px}
      .feed-url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72vw}
      .delivery-main{grid-template-columns:1fr}
      .delivery-actions{justify-content:flex-start}
      .side-card{padding:20px 0}
      .top-actions .btn{padding:7px 9px;font-size:11px}
    }

    .starter-page{max-width:780px;margin:0 auto;padding:42px 0 20px}
    .starter-page h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,64px);line-height:.98;font-weight:600;letter-spacing:-.04em;margin:10px 0 14px}
    .starter-deck{border-top:1px solid var(--ink);margin-top:28px}
    .starter-option{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
    .starter-option h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:600;margin:0}
    .starter-option p{margin:5px 0 8px;color:#4f4c46;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.4}
    .starter-sources{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .starter-add{width:42px;height:42px;padding:0!important;font-size:24px;display:grid;place-items:center;border-color:var(--ink)}
    .starter-add:hover{background:var(--red);border-color:var(--red);color:white}
    .starter-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:18px;flex-wrap:wrap}
    .starter-ready{max-width:720px;margin:0 auto;padding:54px 0 20px}
    .starter-ready h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,8vw,68px);font-weight:600;letter-spacing:-.04em;line-height:.98;margin:10px 0 16px}
    .ready-edition{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0;margin:26px 0}
    .ready-edition-name{font-family:Georgia,"Times New Roman",serif;font-size:28px}
    .ready-actions{display:flex;gap:9px;flex-wrap:wrap}
    .setup-page{max-width:760px;margin:0 auto;padding:44px 0 20px}
    .setup-page h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,62px);font-weight:600;letter-spacing:-.04em;line-height:1;margin:10px 0 14px}
    .setup-list{border-top:1px solid var(--ink);margin-top:28px}
    .setup-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}
    .setup-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);font-weight:800;font-size:13px;padding-top:4px}
    .setup-row h3{font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;margin:0 0 6px}
    .setup-row p{margin:0 0 12px;color:#504d47;font-size:14px;line-height:1.5}
    .setup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
    @media(max-width:760px){
      .starter-page,.starter-ready,.setup-page{padding-top:28px}
      .starter-option{padding:18px 0;gap:12px}
      .starter-option h3{font-size:23px}
      .starter-add{width:40px;height:40px}
      .setup-row{grid-template-columns:34px minmax(0,1fr);gap:10px}
      .ready-actions .btn,.setup-actions .btn{width:100%}
    }

    /* Compact dashboard pass */
    .dashboard-main .editorial-section{padding:20px 0}
    .dashboard-main .editorial-section:first-child{padding-top:4px}

<body>
<div id="app"></div>
<div id="modal" class="modal" aria-hidden="true"></div>
<div id="toast" class="toast" role="status"></div>
<script src="/opml.js"></script>
<script src="/starter-editions.js"></script>
<script>
const API='https://wuikfmmwvrzpaoevtskn.supabase.co/functions/v1/app-api';
const SENDER='reader@antonioskilton.com';
const AMAZON_SETTINGS='https://www.amazon.com/mycd';
const AMAZON_HELP='https://digprjsurvey.amazon.com/csad/help/node/GK4QXXXR76TPPVPM?searchNodes=GDRLC59WEFZTBPU7';
const app=document.querySelector('#app');
const modal=document.querySelector('#modal');
const toastEl=document.querySelector('#toast');
let token=localStorage.morningReaderToken||'';
let state=null;
const expandedSections=new Set();
let toastTimer=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=value=>{try{return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value))}catch{return ''}};
const fmtTime=value=>{try{return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(value))}catch{return ''}};
function maskEmail(value){
  if(!value)return 'Not connected';
  const parts=String(value).split('@');if(parts.length!==2)return value;
  const local=parts[0],domain=parts[1];
  const shown=local.slice(0,Math.min(2,local.length));
  return shown+'••••••@'+domain;
}
function latestRunText(job){
  if(!job)return '';
  const when=fmtTime(job.finished_at||job.updated_at||job.created_at);
  const articles=job.result?.articles;
  if(job.status==='sent')return `Last sent ${when}${articles!=null?' · '+articles+' article'+(articles===1?'':'s'):''}`;
  if(job.status==='empty')return `Last checked ${when} · No new articles`;
  if(job.status==='failed')return `Last send failed ${when}`;
  if(job.status==='running')return 'Building your edition…';
  if(job.status==='queued')return 'Send queued…';
  return `Last run ${when} · ${String(job.status||'').toLowerCase()}`;
}
const shell=(body,actions='')=>`<div class="shell">
  <div class="topbar">
    <div class="brand-wrap"><div class="brand">Morning Reader</div><div class="brand-kicker">Your personal morning paper</div></div>
    <div class="top-actions">${actions}</div>
  </div>
  ${body}
  <footer>
    <a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="https://github.com/phinneywood/rss-to-kindle">Source</a>
    <span>Free beta</span>
  </footer>
</div>`;

function toast(message){
  clearTimeout(toastTimer);
  toastEl.textContent=message;
  toastEl.classList.add('show');
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3200);
}
function openModal(content){
  modal.innerHTML=`<div class="modal-card">${content}</div>`;
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  modal.onclick=e=>{if(e.target===modal)closeModal()};
}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');modal.innerHTML=''}
async function api(path,options={}){
  const headers={'Content-Type':'application/json'};
  if(options.auth!==false&&token)headers.Authorization='Bearer '+token;
  const response=await fetch(API+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):null});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(body.error||'Request failed');
  return body;
}
async function refresh(){state=await api('/me');render()}

function landing(error=''){
  app.innerHTML=shell(`
    <section class="auth-page">
      <div class="auth-hero">
        <div class="auth-kicker">RSS → EPUB → KINDLE</div>
        <h1>Good things to read.<br>Every morning.</h1>
        <div class="auth-lede">Choose a thoughtful starter edition or bring the sites you already follow. Morning Reader turns them into a clean Kindle edition made for reading.</div>
      </div>

      <section class="auth-form-section">
        <div class="editorial-label">Sign in or start</div>
        <h2>Enter your email.</h2>
        <div class="auth-form-copy">No password. We'll send you a six-digit sign-in code.</div>
        <form id="login-form" class="auth-form">
          <div class="field"><label for="email">Email address</label><input id="email" class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
          ${error?`<div class="notice error">${esc(error)}</div>`:''}
          <div class="auth-form-actions"><button class="btn primary" id="login-submit">Continue →</button></div>
          <div class="auth-note">New here? The same sign-in creates your account. No password to remember.</div>
        </form>
      </section>
    </section>`);
  document.querySelector('#login-form').onsubmit=async e=>{
    e.preventDefault();
    const button=document.querySelector('#login-submit'); button.disabled=true; button.textContent='Sending…';
    const email=new FormData(e.currentTarget).get('email');
    try{await api('/auth/request-code',{method:'POST',body:{email},auth:false});verify(email)}
    catch(err){landing(err.message)}
  };
}
function verify(email,error=''){
  app.innerHTML=shell(`
    <section class="auth-page">
      <div class="auth-hero">
        <div class="auth-kicker">Check your inbox</div>
        <h1>Enter your code.</h1>
        <div class="auth-lede">We sent a six-digit code to <strong>${esc(email)}</strong>. It expires in 10 minutes.</div>
      </div>

      <section class="auth-form-section">
        <div class="editorial-label">Verification</div>
        <h2>Six digits.</h2>
        <form id="verify-form" class="auth-form">
          <div class="field"><label for="code">Verification code</label><input id="code" class="input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="123456"></div>
          ${error?`<div class="notice error">${esc(error)}</div>`:''}
          <div class="auth-form-actions"><button class="btn primary">Continue →</button><button type="button" class="btn ghost" id="back-login">Use another email</button></div>
        </form>
      </section>
    </section>`);
  document.querySelector('#back-login').onclick=()=>landing();
  document.querySelector('#verify-form').onsubmit=async e=>{
    e.preventDefault();
    try{
      const result=await api('/auth/verify-code',{method:'POST',body:{email,code:new FormData(e.currentTarget).get('code')},auth:false});
      token=result.token; localStorage.morningReaderToken=token; state=result; render();
    }catch(err){verify(email,err.message)}
  };
}
async function signOut(){
  try{await api('/auth/logout',{method:'POST'})}catch{}
  token=''; localStorage.removeItem('morningReaderToken'); localStorage.removeItem('morningReaderSkipStarters'); state=null; landing();
}

function feedCount(){
  return state.sections.reduce((n,section)=>n+(section.feeds||[]).length,0);
}

function starterPicker(){
  app.innerHTML=shell(`
    <section class="starter-page">
      <div class="editorial-label">Start reading first</div>
      <h1>Build your first morning paper.</h1>
      <div class="editorial-copy">You don't need to know anything about RSS. Pick a starter edition and Morning Reader will assemble it for you. Every source can be changed later.</div>

      <div class="starter-deck">
        ${STARTER_EDITIONS.map(pack=>`<div class="starter-option">
          <div>
            <h3>${esc(pack.name)}</h3>
            <p>${esc(pack.description)}</p>
            <div class="starter-sources">${pack.sources.map(source=>esc(source.name)).join(' · ')}</div>
          </div>
          <button class="btn starter-add add-starter" data-id="${pack.id}" aria-label="Add ${esc(pack.name)}">+</button>
        </div>`).join('')}
      </div>

      <div class="starter-footer">
        <span class="technical-note">One tap creates a real edition with live feeds.</span>
        <button class="btn small-btn" id="bring-own-feeds">I already have feeds →</button>
      </div>
    </section>`,
    '<button class="btn small-btn" id="sign-out">Sign out</button>');

  document.querySelector('#sign-out').onclick=signOut;
  document.querySelector('#bring-own-feeds').onclick=()=>{
    localStorage.morningReaderSkipStarters='1';
    dashboard();
  };
  document.querySelectorAll('.add-starter').forEach(button=>button.onclick=()=>installStarter(button.dataset.id,button));
}

async function installStarter(id,button){
  const pack=STARTER_EDITIONS.find(item=>item.id===id);
  if(!pack)return;
  const old=button.textContent;button.disabled=true;button.textContent='…';
  try{
    const existingCount=feedCount();
    let payload;
    if(existingCount===0&&state.sections.length){
      const section=state.sections[0];
      state=await api('/sections/'+section.id,{method:'PATCH',body:{name:pack.name}});
      const renamed=state.sections.find(s=>s.id===section.id)||state.sections[0];
      payload=pack.sources.map(source=>({url:source.url,name:source.name,section_id:renamed.id}));
    }else{
      payload=pack.sources.map(source=>({url:source.url,name:source.name,section_name:pack.name}));
    }
    const result=await api('/feeds/bulk',{method:'POST',body:{feeds:payload}});
    state=result.dashboard;
    const summary=result.summary||{};
    const usable=(summary.added||0)+(summary.restored||0)+(summary.duplicate||0);
    if(!usable)throw new Error('Those starter feeds could not be added right now. Try another edition.');
    starterReady(pack,summary);
  }catch(err){
    button.disabled=false;button.textContent=old;toast(err.message);
  }
}

function starterReady(pack,summary={}){
  const section=state.sections.find(s=>s.name.toLowerCase()===pack.name.toLowerCase())||state.sections.find(s=>s.feeds?.length);
  const count=section?.feeds?.length||((summary.added||0)+(summary.restored||0));
  app.innerHTML=shell(`
    <section class="starter-ready">
      <div class="editorial-label">Your first edition</div>
      <h1>Your morning paper has something in it.</h1>
      <div class="editorial-copy">Before setting up your Kindle, take a look at the reading experience. This is the part that matters.</div>

      <div class="ready-edition">
        <div class="ready-edition-name">${esc(pack.name)}</div>
        <div class="technical-note">${count} source${count===1?'':'s'} · editable anytime</div>
      </div>

      <div class="ready-actions">
        <button class="btn primary" id="starter-preview">Preview the edition →</button>
        <button class="btn" id="starter-kindle">Send it to my Kindle</button>
        <button class="btn" id="starter-another">+ Add another starter</button>
      </div>
    </section>`,
    '<button class="btn small-btn" id="sign-out">Sign out</button>');

  document.querySelector('#sign-out').onclick=signOut;
  document.querySelector('#starter-preview').onclick=previewModal;
  document.querySelector('#starter-kindle').onclick=onboarding;
  document.querySelector('#starter-another').onclick=starterPicker;
}

function onboarding(){
  const settings=state.settings||{};
  const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||settings.timezone||'UTC';
  app.innerHTML=shell(`
    <section class="setup-page">
      <div class="editorial-label">Final step</div>
      <h1>Send it to your Kindle.</h1>
      <div class="editorial-copy">Amazon requires two addresses to be connected once. After that, Morning Reader can deliver your editions automatically.</div>

      <div class="setup-list">
        <div class="setup-row">
          <div class="setup-num">01</div>
          <div>
            <h3>Approve Morning Reader</h3>
            <p>Add our sender address to Amazon's <strong>Approved Personal Document E-mail List</strong>.</p>
            <div class="codebox"><code>${SENDER}</code><button class="btn small-btn" type="button" id="copy-sender">Copy</button></div>
            <div class="row wrap" style="justify-content:flex-start;margin-top:10px">
              <a class="btn small-btn" href="${AMAZON_SETTINGS}" target="_blank" rel="noopener">Open Amazon settings ↗</a>
              <a class="btn small-btn" href="${AMAZON_HELP}" target="_blank" rel="noopener">Amazon help ↗</a>
            </div>
          </div>
        </div>

        <div class="setup-row">
          <div class="setup-num">02</div>
          <div>
            <h3>Add your Kindle address</h3>
            <p>On that same Amazon page, copy your <strong>Send-to-Kindle E-Mail</strong> address and paste it here.</p>
            <div class="field" style="margin-bottom:0"><label for="kindle-email">Send-to-Kindle address</label><input id="kindle-email" class="input" type="email" placeholder="yourname_123@kindle.com" value="${esc(settings.kindle_email||'')}"></div>
          </div>
        </div>

        <div class="setup-row">
          <div class="setup-num">03</div>
          <div>
            <h3>Choose when it arrives</h3>
            <p>Morning Reader uses your timezone and handles daylight-saving changes automatically.</p>
            <div class="row wrap">
              <div class="field" style="flex:1;min-width:145px"><label for="delivery-time">Time</label><input id="delivery-time" class="input" type="time" value="${esc((settings.delivery_time||'06:00').slice(0,5))}"></div>
              <div class="field" style="flex:2;min-width:210px"><label for="timezone">Timezone</label><input id="timezone" class="input" value="${esc(timezone)}"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="setup-actions">
        <button class="btn primary" id="finish-setup">Save & send a test edition →</button>
        <button class="btn" id="back-to-paper">Back to my paper</button>
      </div>
    </section>`,
    '<button class="btn small-btn" id="sign-out">Sign out</button>');

  document.querySelector('#sign-out').onclick=signOut;
  document.querySelector('#back-to-paper').onclick=()=>dashboard();
  document.querySelector('#copy-sender').onclick=async()=>{await navigator.clipboard.writeText(SENDER);toast('Sender address copied')};
  document.querySelector('#finish-setup').onclick=async()=>{
    const kindle=document.querySelector('#kindle-email').value.trim();
    const delivery=document.querySelector('#delivery-time').value;
    const tz=document.querySelector('#timezone').value.trim();
    if(!kindle){toast('Enter your Send-to-Kindle address first.');return}
    const button=document.querySelector('#finish-setup');button.disabled=true;button.textContent='Saving…';
    try{
      state=await api('/settings',{method:'PATCH',body:{kindle_email:kindle,delivery_time:delivery,timezone:tz,onboarding_complete:true}});
      localStorage.removeItem('morningReaderSkipStarters');
      dashboard();
      await queueSend('/send-test','Your first test edition is queued');
    }catch(err){button.disabled=false;button.textContent='Save & send a test edition →';toast(err.message)}
  };
}

function feedStatus(feed){
  if(feed.last_error)return '<span class="status fail"><span class="dot"></span>Needs attention</span>';
  if(!feed.enabled)return '<span class="status off"><span class="dot"></span>Paused</span>';
  return '<span class="status"><span class="dot"></span>Active</span>';
}
function feedRow(feed){
  return `<div class="feed">
    <div>
      <div class="feed-title">${esc(feed.name)}</div>
      <div class="feed-url">${esc(feed.url)}</div>
      ${feed.last_error?`<div class="technical-note" style="color:var(--red)">${esc(feed.last_error)}</div>`:''}
    </div>
    <div class="feed-actions">
      <button class="feed-manage manage-feed" data-id="${feed.id}" aria-label="Manage ${esc(feed.name)}">•••</button>
    </div>
  </div>`;
}
function sectionCard(section,index){
  const expanded=expandedSections.has(section.id);
  return `<section class="section-card">
    <div class="section-head row">
      <div class="edition-index">${String(index+1).padStart(2,'0')}</div>
      <div class="section-name">
        <h3>${esc(section.name)}</h3>
        <span class="section-meta">${section.feeds.length} source${section.feeds.length===1?'':'s'}</span>
      </div>
      <button class="disclosure-btn toggle-sources" data-id="${section.id}" aria-expanded="${expanded}" aria-label="${expanded?'Collapse':'Expand'} ${esc(section.name)} edition">${expanded?'⌄':'›'}</button>
    </div>
    <div class="edition-details" ${!expanded?'hidden':''}>
      <div class="edition-manage"><button class="btn small-btn rename-section" data-id="${section.id}">Rename edition</button></div>
      <div class="feed-list">${section.feeds.length?section.feeds.map(feedRow).join(''):'<div class="empty">No sources in this edition yet.</div>'}</div>
    </div>
  </section>`;
}
function runBadge(status){
  const cls=status==='failed'?'fail':status==='queued'||status==='running'?'warn':'';
  return `<span class="status ${cls}"><span class="dot"></span>${esc(status)}</span>`;
}

function dashboard(){
  const settings=state.settings;
  const allFeeds=state.sections.flatMap(s=>s.feeds);
  const problemFeeds=allFeeds.filter(f=>f.last_error).length;
  const latestJob=(state.jobs||[])[0];
  const editionCount=state.sections.length;

  app.innerHTML=shell(`
    <div class="grid editorial-grid">
      <main class="dashboard-main">
        ${problemFeeds?`<div class="problem-banner"><strong>${problemFeeds} source${problemFeeds===1?' needs':'s need'} attention.</strong> Expand an edition to review it.</div>`:''}

        <section class="editorial-section">
          <div class="editorial-head add-sources-head">
            <div>
              <div class="editorial-label">Build your morning paper</div>
              <h2>Add sources</h2>
            </div>
          </div>
          <div class="source-index-list">
            <a href="#" class="source-index-action" id="add-single-feed">
              <span class="source-index-number" aria-hidden="true">+</span>
              <span class="source-index-copy"><span class="source-index-title">Add a single feed</span><span class="source-index-meta">Website or RSS address</span></span>
              <span class="source-index-arrow">›</span>
            </a>
            <a href="#" class="source-index-action" id="import-opml">
              <span class="source-index-number" aria-hidden="true">⇣</span>
              <span class="source-index-copy"><span class="source-index-title">Bulk upload</span><span class="source-index-meta">Import an OPML file</span></span>
              <span class="source-index-arrow">›</span>
            </a>
          </div>
        </section>

        <section class="editorial-section">
          <div class="editorial-head editions-heading">
            <div>
              <div class="editorial-label">Kindle editions</div>
              <h2>Your editions</h2>
            </div>
            <div class="edition-total">${editionCount} edition${editionCount===1?'':'s'} · ${allFeeds.length} sources</div>
          </div>
          <div class="editions-list">${state.sections.map((section,index)=>sectionCard(section,index)).join('')}</div>
          <div class="new-edition-row"><button class="btn" id="add-section">+ New edition</button></div>
        </section>
      </main>

      <aside class="dashboard-side">
        <section class="side-card compact-panel">
          <div class="editorial-label">Delivery</div>
          <div class="delivery-main compact-delivery" style="margin-top:10px">
            <div class="delivery-time">${esc((settings.delivery_time||'06:00').slice(0,5))}</div>
            <div class="delivery-meta">${settings.paused?'PAUSED':'SCHEDULED'} · ${esc(settings.timezone)}</div>
            <div class="delivery-actions compact-delivery-actions">
              <button class="btn small-btn" id="preview">Preview</button>
              ${settings.onboarding_complete?`
                <button class="btn primary small-btn" id="send-now">Send now</button>
                <button class="btn small-btn overflow-btn" id="delivery-menu" aria-label="More delivery options">•••</button>
              `:`<button class="btn primary small-btn" id="connect-kindle">Connect Kindle →</button>`}
            </div>
          </div>
          ${latestJob?`<div class="latest-run human-run">${esc(latestRunText(latestJob))}</div>`:''}
        </section>

        <section class="side-card compact-panel">
          <div class="editorial-label">Kindle</div>
          <div class="kindle-status-row">
            <div>
              <div class="kindle-state">Kindle · ${settings.onboarding_complete?'Connected':'Not connected'}</div>
              <div class="kindle-address">${esc(maskEmail(settings.kindle_email))}</div>
            </div>
            ${settings.onboarding_complete
              ?'<button class="btn small-btn kindle-manage" id="manage-kindle">Manage →</button>'
              :'<button class="btn small-btn kindle-manage" id="connect-kindle-secondary">Connect →</button>'}
          </div>
        </section>
      </aside>
    </div>`,
    '<button class="btn account-menu-btn" id="account-menu" aria-label="Account menu">•••</button>');
  wireDashboard();
}

function wireDashboard(){
  document.querySelector('#account-menu').onclick=accountMenuModal;
  document.querySelector('#add-section').onclick=()=>sectionModal();
  document.querySelector('#add-single-feed').onclick=e=>{e.preventDefault();singleFeedModal()};
  document.querySelector('#import-opml').onclick=e=>{e.preventDefault();opmlImportModal()};

  const sendNow=document.querySelector('#send-now');if(sendNow)sendNow.onclick=()=>queueSend('/send-now','Edition queued');
  const preview=document.querySelector('#preview');if(preview)preview.onclick=previewModal;
  const deliveryMenu=document.querySelector('#delivery-menu');if(deliveryMenu)deliveryMenu.onclick=deliveryMenuModal;
  const manageKindle=document.querySelector('#manage-kindle');if(manageKindle)manageKindle.onclick=kindleManageModal;
  const connectKindle=document.querySelector('#connect-kindle');if(connectKindle)connectKindle.onclick=onboarding;
  const connectKindleSecondary=document.querySelector('#connect-kindle-secondary');if(connectKindleSecondary)connectKindleSecondary.onclick=onboarding;

  document.querySelectorAll('.toggle-sources').forEach(button=>button.onclick=()=>{
    const id=button.dataset.id;
    if(expandedSections.has(id))expandedSections.delete(id);else expandedSections.add(id);
    dashboard();
  });
  document.querySelectorAll('.rename-section').forEach(button=>button.onclick=()=>renameSectionModal(button.dataset.id));
  document.querySelectorAll('.manage-feed').forEach(button=>button.onclick=()=>feedActionsModal(button.dataset.id));
}

function deliveryMenuModal(){
  openModal(`<div class="row"><div><div class="editorial-label">Delivery</div><h2 style="margin-top:6px">More options</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <div class="menu-list">
      <button class="menu-action" id="menu-send-test">Send a test edition</button>
      <button class="menu-action" id="menu-edit-delivery">Edit delivery settings</button>
      <button class="menu-action" id="menu-toggle-schedule">${state.settings.paused?'Resume scheduled delivery':'Pause scheduled delivery'}</button>
    </div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#menu-send-test').onclick=()=>{closeModal();queueSend('/send-test','Test edition queued')};
  document.querySelector('#menu-edit-delivery').onclick=settingsModal;
  document.querySelector('#menu-toggle-schedule').onclick=async()=>{
    try{
      state=await api('/settings',{method:'PATCH',body:{paused:!state.settings.paused}});
      closeModal();dashboard();toast(state.settings.paused?'Delivery paused':'Delivery resumed');
    }catch(err){toast(err.message)}
  };
}

function kindleManageModal(){
  const s=state.settings;
  openModal(`<div class="row"><div><div class="editorial-label">Kindle</div><h2 style="margin-top:6px">Connected</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <div style="margin-top:14px;font-family:Georgia,'Times New Roman',serif;font-size:18px;word-break:break-word">${esc(s.kindle_email||'Not configured')}</div>
    <div class="technical-note" style="margin-top:7px">Approved sender: ${SENDER}</div>
    <div class="menu-list">
      <button class="menu-action" id="kindle-edit-settings">Edit Kindle & delivery settings</button>
      <a class="menu-action" href="${AMAZON_SETTINGS}" target="_blank" rel="noopener" style="text-decoration:none">Open Amazon settings ↗</a>
    </div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#kindle-edit-settings').onclick=settingsModal;
}

function accountMenuModal(){
  openModal(`<div class="row"><div><div class="editorial-label">Morning Reader</div><h2 style="margin-top:6px">Account</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <div class="menu-list"><button class="menu-action" id="account-sign-out">Sign out</button></div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#account-sign-out').onclick=()=>{closeModal();signOut()};
}

function sectionModal(){
  openModal(`<div class="row"><h2>New Kindle edition</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Every edition is delivered as its own EPUB. Add related sources to the same edition; create separate editions for topics you want to keep apart. The edition name also becomes the Kindle cover title.</p>
    <form id="section-form"><div class="field"><label for="section-name">Edition name</label><input id="section-name" class="input" name="name" required maxlength="80" placeholder="Technology, Essays, Design…"></div><button class="btn primary">Create edition</button></form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#section-form').onsubmit=async e=>{
    e.preventDefault();
    try{state=await api('/sections',{method:'POST',body:{name:new FormData(e.currentTarget).get('name')}});closeModal();dashboard();toast('Edition created')}
    catch(err){toast(err.message)}
  };
}
function renameSectionModal(id){
  const section=state.sections.find(s=>s.id===id);
  if(!section)return;
  openModal(`<div class="row"><h2>Rename edition</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">The new name will appear on future EPUB filenames and Kindle covers.</p>
    <form id="rename-section-form"><div class="field"><label>Edition name</label><input class="input" name="name" required maxlength="80" value="${esc(section.name)}"></div><button class="btn primary">Save name</button></form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#rename-section-form').onsubmit=async e=>{
    e.preventDefault();
    try{
      state=await api('/sections/'+id,{method:'PATCH',body:{name:new FormData(e.currentTarget).get('name')}});
      closeModal();dashboard();toast('Edition renamed');
    }catch(err){toast(err.message)}
  };
}
function singleFeedModal(){
  openModal(`<div class="row"><div><div class="editorial-label">Add source</div><h2 style="margin-top:6px">Add a single feed</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Paste a publication's website or RSS address. Morning Reader will find the feed for you.</p>
    <form id="single-feed-form">
      <div class="field"><label for="single-feed-url">Website or RSS feed</label><input id="single-feed-url" class="input" name="url" required placeholder="https://example.com"></div>
      <div class="field"><label for="single-feed-section">Add to edition</label><select id="single-feed-section" class="select" name="section_id">${state.sections.map(section=>`<option value="${section.id}">${esc(section.name)}</option>`).join('')}</select></div>
      <button class="btn primary" id="single-feed-submit">Find & add feed →</button>
    </form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#single-feed-form').onsubmit=async e=>{
    e.preventDefault();
    const form=e.currentTarget,data=new FormData(form),input=String(data.get('url')||'').trim(),sectionId=String(data.get('section_id')||'');
    const button=document.querySelector('#single-feed-submit');button.disabled=true;button.textContent='Finding…';
    try{
      const result=await api('/discover',{method:'POST',body:{url:input}});
      const feeds=result.feeds||[];
      if(!feeds.length)throw new Error("No RSS or Atom feed found.");
      if(feeds.length===1){
        state=await api('/feeds',{method:'POST',body:{section_id:sectionId,url:feeds[0].url}});
        closeModal();dashboard();toast('Source added');return;
      }
      chooseFeedModal(sectionId,feeds);
    }catch(err){
      button.disabled=false;button.textContent='Find & add feed →';toast(err.message);
    }
  };
}
function chooseFeedModal(sectionId,feeds){
  openModal(`<div class="row"><h2>Choose a feed</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">This site publishes more than one feed. Pick the one you want in this edition.</p>
    <div class="stack">${feeds.map((feed,i)=>`<button class="card choose-discovered-feed" data-i="${i}" style="text-align:left;cursor:pointer"><strong>${esc(feed.title||'Untitled feed')}</strong><div class="tiny muted" style="margin-top:4px;word-break:break-all">${esc(feed.url)}</div></button>`).join('')}</div>
    <p class="tiny muted" style="margin-top:14px"><a href="https://feedsearch.dev/" target="_blank" rel="noopener">powered by Feedsearch ↗</a></p>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelectorAll('.choose-discovered-feed').forEach(button=>button.onclick=async()=>{
    const feed=feeds[Number(button.dataset.i)];button.disabled=true;
    try{state=await api('/feeds',{method:'POST',body:{section_id:sectionId,url:feed.url}});closeModal();dashboard();toast('Source added')}
    catch(err){button.disabled=false;toast(err.message)}
  });
}
function feedActionsModal(id){
  const feed=state.sections.flatMap(s=>s.feeds).find(f=>f.id===id);
  if(!feed)return;
  openModal(`<div class="row"><div><div class="editorial-label">Source</div><h2 style="margin-top:6px">${esc(feed.name)}</h2></div><button class="btn small-btn" id="close-modal">Close</button></div>
    <div class="technical-note" style="word-break:break-all;margin:8px 0 18px">${esc(feed.url)}</div>
    ${feed.last_error?`<div class="notice error" style="margin-bottom:14px">${esc(feed.last_error)}</div>`:''}
    <div class="row wrap" style="justify-content:flex-start">
      <button class="btn" id="manage-move">Move</button>
      <button class="btn" id="manage-toggle">${feed.enabled?'Pause':'Resume'}</button>
      <button class="btn danger" id="manage-delete">Delete</button>
    </div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#manage-move').onclick=()=>moveFeedModal(id,feed.section_id);
  document.querySelector('#manage-delete').onclick=()=>deleteFeedModal(id);
  document.querySelector('#manage-toggle').onclick=async()=>{
    try{state=await api('/feeds/'+id,{method:'PATCH',body:{enabled:!feed.enabled}});closeModal();dashboard();toast(feed.enabled?'Source paused':'Source resumed')}
    catch(err){toast(err.message)}
  };
}
function moveFeedModal(id,currentSectionId){
  const feed=state.sections.flatMap(s=>s.feeds).find(f=>f.id===id);
  const choices=state.sections.filter(s=>s.id!==currentSectionId);
  if(!feed||!choices.length){toast('Create another edition first.');return}
  openModal(`<div class="row"><h2>Move source</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <p class="muted small">Move <strong>${esc(feed.name)}</strong> into a different Kindle edition.</p>
    <div class="stack">${choices.map(section=>`<button class="card move-to-edition" data-id="${section.id}" style="text-align:left;cursor:pointer"><strong>${esc(section.name)}</strong><div class="tiny muted" style="margin-top:4px">This source will be included in that EPUB instead.</div></button>`).join('')}</div>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelectorAll('.move-to-edition').forEach(button=>button.onclick=async()=>{
    button.disabled=true;
    try{
      state=await api('/feeds/'+id,{method:'PATCH',body:{section_id:button.dataset.id}});
      closeModal();dashboard();toast('Source moved to another edition');
    }catch(err){button.disabled=false;toast(err.message)}
  });
}
function deleteFeedModal(id){
  const feed=state.sections.flatMap(s=>s.feeds).find(f=>f.id===id);
  openModal(`<h2>Delete feed?</h2><p>This removes <strong>${esc(feed?.name||'this feed')}</strong> from future editions. Past delivery history remains.</p><div class="row wrap" style="justify-content:flex-start"><button class="btn danger" id="confirm-delete">Delete feed</button><button class="btn" id="cancel-delete">Cancel</button></div>`);
  document.querySelector('#cancel-delete').onclick=closeModal;
  document.querySelector('#confirm-delete').onclick=async()=>{
    try{state=await api('/feeds/'+id,{method:'DELETE'});closeModal();dashboard();toast('Feed deleted')}
    catch(err){toast(err.message)}
  };
}
function settingsModal(){
  const s=state.settings;
  openModal(`<div class="row"><h2>Delivery settings</h2><button class="btn small-btn" id="close-modal">Close</button></div>
    <form id="settings-form">
      <div class="field"><label>Send-to-Kindle address</label><input class="input" type="email" name="kindle_email" required value="${esc(s.kindle_email||'')}"></div>
      <div class="row wrap">
        <div class="field" style="flex:1;min-width:150px"><label>Delivery time</label><input class="input" type="time" name="delivery_time" value="${esc((s.delivery_time||'06:00').slice(0,5))}"></div>
        <div class="field" style="flex:2;min-width:220px"><label>Timezone</label><input class="input" name="timezone" value="${esc(s.timezone)}"></div>
      </div>
      <div class="notice info">Need to change Amazon setup? <a href="${AMAZON_SETTINGS}" target="_blank" rel="noopener"><strong>Open Personal Document Settings ↗</strong></a></div>
      <div style="margin-top:16px"><button class="btn primary">Save settings</button></div>
    </form>`);
  document.querySelector('#close-modal').onclick=closeModal;
  document.querySelector('#settings-form').onsubmit=async e=>{
    e.preventDefault();const form=new FormData(e.currentTarget);
    try{state=await api('/settings',{method:'PATCH',body:{kindle_email:form.get('kindle_email'),delivery_time:form.get('delivery_time'),timezone:form.get('timezone')}});closeModal();dashboard();toast('Settings saved')}
    catch(err){toast(err.message)}
  };
}
async function previewModal(){
  openModal('<div class="row"><h2>Latest articles</h2><button class="btn small-btn" id="close-modal">Close</button></div><p class="muted">Checking your active feeds…</p>');
  document.querySelector('#close-modal').onclick=closeModal;
  try{
    const result=await api('/preview',{method:'POST'});
    const items=result.items||[];
    modal.querySelector('.modal-card').innerHTML=`<div class="row"><h2>Latest articles</h2><button class="btn small-btn" id="close-modal">Close</button></div>
      <p class="muted small">${items.length} recent item${items.length===1?'':'s'} across active feeds. This is a preview only; nothing was sent.</p>
      <div class="preview-list">${items.slice(0,40).map(item=>`<div class="preview-item"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a><div class="preview-source">${esc(item.source)}${item.published_at?' · '+fmtDate(item.published_at):''}</div></div>`).join('')||'<p class="muted">No recent articles found.</p>'}</div>`;
    document.querySelector('#close-modal').onclick=closeModal;
  }catch(err){modal.querySelector('.modal-card').innerHTML=`<h2>Preview unavailable</h2><div class="notice error">${esc(err.message)}</div><div style="margin-top:16px"><button class="btn" id="close-modal">Close</button></div>`;document.querySelector('#close-modal').onclick=closeModal}
}
async function queueSend(path,message){
  const button=path==='/send-test'?document.querySelector('#send-test'):document.querySelector('#send-now');
  button.disabled=true; const old=button.textContent; button.textContent='Queuing…';
  try{
    const result=await api(path,{method:'POST'});
    const fallback=result.next_worker_check_at?new Date(result.next_worker_check_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):null;
    const startCopy=result.worker_triggered?'Processing is starting now.':(fallback?`Queued — processing will start by ${fallback}.`:'Queued for processing.');
    openModal(`<div class="row"><h2>${esc(message)}</h2><button class="btn small-btn" id="close-modal">Close</button></div>
      <div class="notice info" id="job-progress">${esc(startCopy)}</div>
      <p class="muted small">Morning Reader will update this status automatically. After we mark it sent, Amazon may take a few more minutes to place it on your Kindle.</p>`);
    document.querySelector('#close-modal').onclick=closeModal;
    await watchJob(result.job.id);
  }catch(err){button.disabled=false;button.textContent=old;toast(err.message)}
}
async function watchJob(jobId){
  const deadline=Date.now()+120000;
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,2200));
    try{
      state=await api('/me');
      const job=(state.jobs||[]).find(j=>j.id===jobId);
      const box=document.querySelector('#job-progress');
      if(job&&box){
        if(job.status==='queued')box.textContent='Queued — waiting for the worker.';
        if(job.status==='running')box.textContent='Building your Kindle edition now…';
        if(job.status==='sent')box.textContent=`Sent to Amazon · ${job.result?.articles??0} article${job.result?.articles===1?'':'s'}.`;
        if(job.status==='empty')box.textContent='Finished — there were no new articles to send.';
        if(job.status==='failed')box.textContent='The send failed: '+(job.error||'Unknown error');
      }
      if(job&&['sent','empty','failed'].includes(job.status)){setTimeout(()=>{if(!modal.classList.contains('open'))dashboard()},100);return}
    }catch{}
  }
  const box=document.querySelector('#job-progress');if(box)box.textContent='Still processing. You can close this window; Recent runs will keep showing the latest status.';
}
function render(){
  if(state?.settings?.onboarding_complete)return dashboard();
  if(feedCount()===0&&localStorage.morningReaderSkipStarters!=='1')return starterPicker();
  if(feedCount()===0)return dashboard();
  return onboarding();
}

(async()=>{
  if(!token)return landing();
  try{state=await api('/me');render()}catch{token='';localStorage.removeItem('morningReaderToken');landing()}
})();
</script>
