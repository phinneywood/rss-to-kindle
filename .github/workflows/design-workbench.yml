name: Design workbench
on:
  push:
    branches: [design/personal-site-system]
permissions:
  contents: write
concurrency:
  group: design-workbench
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/design/personal-site-system'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one-time presentation refactor on the design branch
        run: |
          python .design/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html opml.js privacy.html terms.html tests/ui.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'design: replace legacy UI layers with shared editorial system'
            git push origin HEAD:design/personal-site-system
          fi
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium responsive interaction and accessibility review
        run: node tests/browser.mjs
      - name: WebKit responsive interaction and accessibility review
        if: success() || failure()
        run: BROWSER=webkit node tests/browser.mjs
      - name: Bundle source for visual inspection
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          tar --exclude=.git --exclude=node_modules --exclude=test-results -czf test-results/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-review
          path: test-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
