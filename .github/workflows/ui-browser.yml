name: UI browser checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install pinned browser-only test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Responsive interaction, accessibility, and visual evidence
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.browser }}
          path: test-results/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: error
